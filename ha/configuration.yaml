
# Loads default set of integrations. Do not remove.
default_config:

# Pakete: je Thema eine Datei unter /config/packages/ (z. B. heidi.yaml)
homeassistant:
  packages: !include_dir_named packages
  allowlist_external_dirs:
    - /config/www
    - /config/prognose

# Diagnose-Protokoll (Bauplan F.1): Rohmeldungen der Dreame-Integration auf Debug-Stufe. Die Automation
# heidi_diagnose_debuglog sichert sie jede Minute nach /config/prognose/diag/. Alles andere bleibt auf „warning“.
logger:
  default: warning
  logs:
    custom_components.dreame_vacuum: debug

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Dashboards im YAML-Modus (Dateien unter /config/dashboards/)
lovelace:
  mode: storage
  dashboards:
    # Heidi-Karte v2 (Projekt dreame_x60, Bauplan docs/dreame_x60/BAUPLAN.md). v1 (heidi-yaml, heidi-panel.js) am 15.09.2026
    # abgeschaltet – Referenz im Repo unter heidi/archiv/.
    dreame-x60:
      mode: yaml
      title: Heidi
      icon: mdi:robot-vacuum
      show_in_sidebar: true
      filename: dashboards/dreame_x60.yaml

# Helfer (Schalter) für Heidi
input_boolean:
  stuehle_am_boden:
    name: Stühle am Boden
    icon: mdi:chair-rolling
