- id: heidi_sperrzone_esstisch
  alias: "Heidi: Sperrzone Esstisch (Stühle am Boden)"
  description: >-
    Setzt eine Sperrzone um den Esstisch, solange der Schalter "Stühle am Boden" an ist.
    Koordinaten = erkannter Esstisch (x -3600..-1750, y -4175..-2675) + 600 mm Rand.
    Achtung: Der Dienst ersetzt immer ALLE Sperrzonen – weitere Zonen hier mit eintragen.
  mode: single
  triggers:
    - trigger: state
      entity_id: input_boolean.stuehle_am_boden
      to: "on"
      id: stuehle_unten
    - trigger: state
      entity_id: input_boolean.stuehle_am_boden
      to: "off"
      id: stuehle_oben
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: stuehle_unten
          sequence:
            - action: dreame_vacuum.vacuum_set_restricted_zone
              target:
                entity_id: vacuum.heidi
              data:
                zones:
                  - [-4200, -4775, -1150, -2075]
        - conditions:
            - condition: trigger
              id: stuehle_oben
          sequence:
            - action: dreame_vacuum.vacuum_set_restricted_zone
              target:
                entity_id: vacuum.heidi
              data:
                zones: []

# ═══════════════════════ Planer ═══════════════════════
- id: heidi_planer
  alias: "Heidi: Planer"
  description: >-
    Prüft alle 10 Minuten und bei jeder Anwesenheitsänderung, ob der heutige Planer-Eintrag
    starten soll. Blockiert wird nur durch die im Eintrag gewählten Personen ("stört").
    Homeoffice (Arbeitszeit + störende Person zu Hause): je nach Eintrag warten oder leise starten.
    Schnellprogramm, wenn die erwartete Rückkehr bald ist.
  mode: single
  triggers:
    - trigger: time_pattern
      minutes: "/10"
    - trigger: state
      entity_id: [person.herbert_schrotter, person.nicole_2, person.nina_2]
      to: ["home", "not_home"]
      for: { minutes: 2 }
    - trigger: state
      entity_id: input_boolean.heidi_automatik
      to: "on"
    # Genau zur Uhrzeit des heutigen Eintrags (Template mit now() wird jede Minute geprüft)
    - trigger: template
      value_template: "{{ now().strftime('%H:%M') == state_attr('sensor.heidi_heutiger_plan', 'zeit') }}"
    # Sobald sich am heutigen Eintrag etwas ändert (Uhrzeit, erledigt, stört-Personen, Eintrag)
    - trigger: state
      entity_id: sensor.heidi_heutiger_plan
  conditions:
    - condition: state
      entity_id: input_boolean.heidi_automatik
      state: "on"
    - condition: state
      entity_id: input_boolean.heidi_auto_lauf
      state: "off"
    - condition: state
      entity_id: binary_sensor.heidi_nicht_storen  # HA macht aus "stören" -> "storen" (nicht "stoeren")
      state: "off"
    - condition: template
      value_template: "{{ states('sensor.heidi_heutiger_plan') not in ['0','unknown','unavailable'] }}"
    - condition: template
      value_template: "{{ not state_attr('sensor.heidi_heutiger_plan', 'erledigt') }}"
    - condition: template
      value_template: "{{ now().strftime('%H:%M') >= state_attr('sensor.heidi_heutiger_plan', 'zeit') }}"
    - condition: state
      entity_id: vacuum.heidi
      state: docked
    - condition: template
      value_template: "{{ states('sensor.heidi_battery_level') | int(0) >= states('input_number.heidi_min_akku') | int(30) }}"
    # Nur echte Fehler blockieren – Hinweise wie "clean_mop_pad" (Mopps reinigen) nicht
    - condition: template
      value_template: "{{ not state_attr('vacuum.heidi', 'has_error') }}"
  variables:
    slot: "{{ states('sensor.heidi_heutiger_plan') }}"
    name: "{{ state_attr('sensor.heidi_heutiger_plan', 'name') }}"
    stoerer: "{{ state_attr('sensor.heidi_heutiger_plan', 'stoerer') or [] }}"
    blockiert: "{{ stoerer | length > 0 }}"
    ho: "{{ blockiert and is_state('binary_sensor.heidi_arbeitszeit', 'on') }}"
    ho_leise: "{{ ho and is_state('input_select.heidi_plan' ~ slot ~ '_homeoffice', 'Leise starten') }}"
    schnell_erlaubt: "{{ is_state('input_boolean.heidi_plan' ~ slot ~ '_schnell', 'on') }}"
    use_prog: >-
      {{ is_state('input_boolean.heidi_prognose_aktiv','on') and is_state('input_boolean.heidi_abweichung_heute','off')
         and (state_attr('sensor.heidi_prognose','tage') | int(0)) >= (states('input_number.heidi_prognose_mindesttage') | int(14)) and (state_attr('sensor.heidi_prognose','rueckkehr_min') | int(0)) > 0 }}
    rest_min: >-
      {% if use_prog %}{{ state_attr('sensor.heidi_prognose','rueckkehr_min') | int(0) }}
      {% else %}{% set rk = states('input_datetime.heidi_rueckkehr') %}{{ (rk[:2] | int) * 60 + (rk[3:5] | int) - now().hour * 60 - now().minute }}{% endif %}
    # Alte Regel (Rückfall, solange keine Lernwerte da sind): Schnellprogramm unter X Minuten Rest
    schnell: "{{ schnell_erlaubt and (rest_min | int) < (states('input_number.heidi_schnell_minuten') | int(90)) and not blockiert }}"
    est_args: >-
      {{ {'rooms': states('input_text.heidi_plan' ~ slot ~ '_raeume').split(',') | map('trim') | reject('eq', '') | map('int') | list,
          'sequence': state_attr('vacuum.heidi', 'cleaning_sequence') or [],
          'modus': states('input_select.heidi_plan' ~ slot ~ '_modus'), 'saug': states('input_select.heidi_plan' ~ slot ~ '_saugstufe'),
          'wdh': states('input_select.heidi_plan' ~ slot ~ '_wiederholungen'), 'raumwerte': states('input_text.heidi_plan' ~ slot ~ '_raumwerte'),
          'sp_saug': states('input_select.heidi_plan' ~ slot ~ '_sp_saug'), 'sp_wdh': states('input_select.heidi_plan' ~ slot ~ '_sp_wdh'),
          'batt': states('sensor.heidi_battery_level') | int(100)} }}
  actions:
    # Dauer-Schätzung aus den Lernwerten (runlog.py). Entscheidung: volles Programm, wenn es bis zur
    # erwarteten Rückkehr reicht; sonst Schnellprogramm, wenn erlaubt und ausreichend; sonst warten.
    # Ohne Lernwerte oder bei Fehler gilt die alte Regel (schnell).
    - action: shell_command.heidi_schaetzung
      continue_on_error: true
      response_variable: est_voll
      data: { args: "{{ dict(est_args, variante='normal') | to_json }}" }
    - action: shell_command.heidi_schaetzung
      continue_on_error: true
      response_variable: est_schnell
      data: { args: "{{ dict(est_args, variante='schnell') | to_json }}" }
    - variables:
        lern_ok: "{{ est_voll is defined and (est_voll.stdout | default('')) is search('\"total\"') and (est_voll.stdout | from_json).gelernt }}"
        dauer_voll: "{{ (est_voll.stdout | from_json).total if lern_ok else -1 }}"
        dauer_schnell: "{{ (est_schnell.stdout | from_json).total if lern_ok and est_schnell is defined and (est_schnell.stdout | default('')) is search('\"total\"') else -1 }}"
        wahl: >-
          {% if blockiert %}warten
          {% elif not lern_ok %}{{ 'schnell' if schnell else 'normal' }}
          {% elif (rest_min | int) <= 0 or (dauer_voll | int) <= (rest_min | int) %}normal
          {% elif schnell_erlaubt and (dauer_schnell | int) <= (rest_min | int) %}schnell
          {% else %}warten{% endif %}
    - choose:
        # Keine störende Person zu Hause und Zeit reicht → normal oder Schnellprogramm
        - conditions: "{{ wahl in ['normal', 'schnell'] }}"
          sequence:
            - action: input_boolean.turn_off
              target: { entity_id: input_boolean.heidi_auto_teil }
            - action: input_boolean.turn_on
              target: { entity_id: input_boolean.heidi_auto_lauf }
            - action: input_text.set_value
              target: { entity_id: input_text.heidi_auto_letzter_plan }
              data: { value: "{{ name }}{{ ' (schnell)' if wahl == 'schnell' else '' }}" }
            - action: script.heidi_plan_starten
              data: { plan: "{{ slot }}", variante: "{{ wahl }}" }
        # Homeoffice und Eintrag sagt "Leise starten" → leises Profil, gilt danach als erledigt
        - conditions: "{{ ho_leise }}"
          sequence:
            - action: input_boolean.turn_off
              target: { entity_id: input_boolean.heidi_auto_teil }
            - action: input_boolean.turn_on
              target: { entity_id: input_boolean.heidi_auto_lauf }
            - action: input_text.set_value
              target: { entity_id: input_text.heidi_auto_letzter_plan }
              data: { value: "{{ name }} (leise, Homeoffice)" }
            - action: script.heidi_plan_starten
              data: { plan: "{{ slot }}", variante: leise }
      # sonst: störende Person zu Hause → warten (nächste Prüfung in 10 min / bei Abwesenheit)

- id: heidi_lauf_abgeschlossen
  alias: "Heidi: Automatik-Lauf abgeschlossen"
  description: Setzt "heute erledigt", wenn ein vom Planer gestarteter Lauf vollständig beendet wurde.
  mode: single
  triggers:
    - trigger: state
      entity_id: vacuum.heidi
      to: docked
      for: { minutes: 1 }
  actions:
    # a) Automatik-Lauf: heute als erledigt buchen
    - if: "{{ is_state('input_boolean.heidi_auto_lauf', 'on') }}"
      then:
        - if:
            - condition: state
              entity_id: sensor.heidi_task_status
              state: completed
            - condition: state
              entity_id: input_boolean.heidi_auto_teil
              state: "off"
          then:
            - action: input_datetime.set_datetime
              target: { entity_id: input_datetime.heidi_letzte_auto_reinigung }
              data: { date: "{{ now().date() }}" }
        - action: input_boolean.turn_off
          target: { entity_id: [input_boolean.heidi_auto_lauf, input_boolean.heidi_auto_teil] }
    # b) Roboter-Raumwerte wieder so, wie sie vor dem Lauf waren (Sicherung aus heidi_reinigung) –
    #    auch bei Handstart über ▶ im Planer, deshalb unabhängig vom Automatik-Lauf
    - if: "{{ states('input_text.heidi_raum_snapshot') not in ['', 'unknown', 'unavailable'] }}"
      then:
        - action: script.heidi_raumwerte_wiederherstellen
          continue_on_error: true
    # c) Lernwerte (Dauer/Akku) aus dem Laufprotokoll neu berechnen
    - action: homeassistant.update_entity
      continue_on_error: true
      target: { entity_id: sensor.heidi_lernwerte }

- id: heidi_heimkehr
  alias: "Heidi: Heimkehr während Reinigung"
  description: Reagiert nur, wenn die heimkehrende Person im laufenden Eintrag als "stört" gewählt ist.
  mode: single
  triggers:
    - trigger: state
      entity_id: [person.herbert_schrotter, person.nicole_2, person.nina_2]
      to: home
  conditions:
    - condition: state
      entity_id: input_boolean.heidi_auto_lauf
      state: "on"
    - condition: state
      entity_id: vacuum.heidi
      state: cleaning
    - condition: template
      value_template: >-
        {% set key = {'person.herbert_schrotter':'herbert','person.nicole_2':'nicole','person.nina_2':'nina'}[trigger.entity_id] %}
        {% set slot = states('sensor.heidi_heutiger_plan') %}
        {{ slot != '0' and key in (states('input_text.heidi_plan' ~ slot ~ '_personen').split(',') | map('trim') | list) }}
  actions:
    - choose:
        - conditions: "{{ is_state('input_select.heidi_bei_heimkehr', 'Zur Station') }}"
          sequence:
            - action: vacuum.return_to_base
              target: { entity_id: vacuum.heidi }
        - conditions: "{{ is_state('input_select.heidi_bei_heimkehr', 'Pausieren') }}"
          sequence:
            - action: vacuum.pause
              target: { entity_id: vacuum.heidi }

# ═══════════════════════ Laufprotokoll (Dauer/Akku lernen) ═══════════════════════
- id: heidi_laufprotokoll
  alias: "Heidi: Laufprotokoll (Dauer und Akku lernen)"
  description: >-
    Schreibt bei jedem Phasenwechsel und jede Minute, solange Heidi unterwegs ist, in der Station nach dem
    Lauf arbeitet oder lädt, eine Rohdatenzeile in /config/prognose/runlog.csv (runlog.py).
  mode: queued
  max: 20
  triggers:
    - trigger: state
      entity_id: sensor.heidi_phase
    - trigger: time_pattern
      minutes: "/1"
  conditions:
    - condition: template
      value_template: >-
        {{ states('vacuum.heidi') in ['cleaning', 'paused', 'returning']
           or (state_attr('vacuum.heidi', 'charging') and states('sensor.heidi_battery_level') | int(100) < 100)
           or states('sensor.heidi_phase') in ['Wäscht Mopps nach dem Lauf', 'Saugt Staub ab'] }}
  actions:
    - variables:
        seg: "{{ state_attr('vacuum.heidi', 'current_segment') or '' }}"
        p: "{{ ('select.heidi_room_' ~ seg ~ '_') if seg else '' }}"
        # Während eines Laufs sind die Raum-Selects teils "unavailable" → Werte aus den Kartendaten des Roboters
        rm: "{{ (state_attr('camera.heidi_map', 'rooms') or {}).get(seg | string, {}) if seg else {} }}"
        sel: "{{ {'cleaning_mode': states(p ~ 'cleaning_mode'), 'suction_level': states(p ~ 'suction_level'), 'mop_pad_humidity': states(p ~ 'mop_pad_humidity'), 'cleaning_route': states(p ~ 'cleaning_route'), 'cleaning_times': states(p ~ 'cleaning_times'), 'floor_material': states(p ~ 'floor_material')} if p else {} }}"
        mode: "{{ sel.cleaning_mode if sel.cleaning_mode is defined and sel.cleaning_mode not in ['unavailable', 'unknown'] else {0: 'sweeping', 1: 'mopping', 2: 'sweeping_and_mopping', 3: 'mopping_after_sweeping'}.get(rm.cleaning_mode, '') }}"
        suction: "{{ sel.suction_level if sel.suction_level is defined and sel.suction_level not in ['unavailable', 'unknown'] else {0: 'quiet', 1: 'standard', 2: 'strong', 3: 'turbo'}.get(rm.suction_level, '') }}"
        water: "{{ sel.mop_pad_humidity if sel.mop_pad_humidity is defined and sel.mop_pad_humidity not in ['unavailable', 'unknown'] else {1: 'slightly_dry', 2: 'moist', 3: 'wet'}.get(rm.water_volume, '') }}"
        times: "{{ sel.cleaning_times if sel.cleaning_times is defined and sel.cleaning_times not in ['unavailable', 'unknown'] else ((rm.cleaning_times ~ 'x') if rm.cleaning_times is defined else '') }}"
        belag: "{{ sel.floor_material if sel.floor_material is defined and sel.floor_material not in ['unavailable', 'unknown'] else (rm.floor_material | default('') | lower) }}"
    - action: shell_command.heidi_runlog
      data:
        zeile: >-
          {{ {'ts': now().strftime('%Y-%m-%dT%H:%M:%S'), 'v': 1, 'phase': states('sensor.heidi_phase'), 'vac': states('vacuum.heidi'),
              'seg': seg, 'room': states('sensor.heidi_current_room'), 'batt': states('sensor.heidi_battery_level'),
              'area': state_attr('vacuum.heidi', 'cleaned_area'), 'ctime': state_attr('vacuum.heidi', 'cleaning_time'),
              'charging': state_attr('vacuum.heidi', 'charging'), 'docked': state_attr('vacuum.heidi', 'docked'),
              'mode': mode, 'suction': suction, 'water': water, 'route': sel.cleaning_route if sel.cleaning_route is defined else '',
              'times': times, 'belag': belag,
              'plan': states('input_text.heidi_auto_letzter_plan') if is_state('input_boolean.heidi_auto_lauf', 'on') else '',
              'variante': '', 'selfclean': states('number.heidi_self_clean_area'), 'mop_pad': state_attr('vacuum.heidi', 'mop_pad'),
              'carpet': states('select.heidi_carpet_cleaning'), 'mop_extend': states('switch.heidi_mop_extend'),
              'water_temp': states('select.heidi_water_temperature')} | to_json }}

# ═══════════════════════ Dashboard & Prognose ═══════════════════════
- id: heidi_dark_mode
  alias: "Heidi: Dark Mode umschalten"
  mode: single
  triggers:
    - trigger: state
      entity_id: input_boolean.heidi_dark_mode
    - trigger: homeassistant
      event: start
  actions:
    - action: script.heidi_theme_anwenden

- id: heidi_prognose_protokoll
  alias: "Heidi: Prognose – Anwesenheit protokollieren"
  mode: single
  triggers:
    - trigger: time_pattern
      minutes: "/5"
  conditions:
    - condition: state
      entity_id: input_boolean.heidi_prognose_aktiv
      state: "on"
    # Intervall aus den Dashboard-Einstellungen (5–60 min, Teiler von 60)
    - condition: template
      value_template: "{{ now().minute % (states('input_number.heidi_prognose_intervall') | int(15)) == 0 }}"
  actions:
    - action: shell_command.heidi_prognose_log

- id: heidi_prognose_config
  alias: "Heidi: Prognose – Einstellungen übernehmen"
  mode: queued
  triggers:
    - trigger: state
      entity_id: [input_boolean.heidi_prog_herbert, input_boolean.heidi_prog_nicole, input_boolean.heidi_prog_nina,
                  input_number.heidi_prognose_wochen, input_number.heidi_prognose_halbwert, input_number.heidi_prognose_aufloesung]
      for: { seconds: 2 }
    - trigger: homeassistant
      event: start
  actions:
    - action: shell_command.heidi_prognose_config
    - action: homeassistant.update_entity
      target: { entity_id: sensor.heidi_prognose }
