heidi_dark:
  # Grundflächen
  primary-background-color: "#0f151c"
  secondary-background-color: "#1f2a35"
  card-background-color: "#18212b"
  ha-card-background: "#18212b"
  app-header-background-color: "#0f151c"
  app-header-text-color: "#e8edf2"
  sidebar-background-color: "#0f151c"
  sidebar-text-color: "#93a1af"
  sidebar-selected-text-color: "#2fd1b6"
  sidebar-selected-icon-color: "#2fd1b6"
  divider-color: "#2a3644"
  # Text
  primary-text-color: "#e8edf2"
  secondary-text-color: "#93a1af"
  text-primary-color: "#0f151c"
  disabled-text-color: "#5b6874"
  # Akzent
  primary-color: "#2fd1b6"
  accent-color: "#2fd1b6"
  light-primary-color: "#163a37"
  dark-primary-color: "#1fb59c"
  state-icon-color: "#93a1af"
  state-icon-active-color: "#2fd1b6"
  state-active-color: "#2fd1b6"
  switch-checked-color: "#2fd1b6"
  slider-color: "#2fd1b6"
  slider-bar-color: "#2a3644"
  paper-item-icon-color: "#93a1af"
  paper-item-icon-active-color: "#2fd1b6"
  # Karten
  ha-card-border-radius: "14px"
  ha-card-border-width: "0"
  ha-card-box-shadow: "0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35)"
  # Mushroom
  mush-rgb-primary: "47, 209, 182"
  mush-rgb-teal: "47, 209, 182"
  mush-rgb-green: "76, 196, 127"
  mush-rgb-orange: "240, 166, 58"
  mush-rgb-red: "239, 107, 107"
  mush-rgb-blue: "90, 160, 240"
  mush-card-primary-font-weight: "600"
  mush-title-font-weight: "700"
  # Sonstiges
  input-fill-color: "#1f2a35"
  input-ink-color: "#e8edf2"
  input-label-ink-color: "#93a1af"
  mdc-theme-primary: "#2fd1b6"
  mdc-theme-surface: "#18212b"
  ha-dialog-surface-background: "#18212b"
  ha-assist-chip-filled-container-color: "#1f2a35"

