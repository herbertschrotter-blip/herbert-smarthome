# dreame_x60 – Heidi-Karte v2 (Bauplan 1.3). Sieben Ansichten, jede zeigt dieselbe Karte mit einer anderen
# Seite (page). start ist die normale Ansicht; die anderen sind Unteransichten mit Zurück-Pfeil nach start.
# Die Karte navigiert selbst über das navigate-Ereignis von HA (URL /dreame-x60/<page>).
title: Heidi v2
views:
  - title: Heidi
    path: start
    icon: mdi:robot-vacuum-variant
    type: panel
    cards:
      - type: custom:dreame-x60-panel
        page: start
        diagnose: true  # Diagnose-Protokoll Schicht 3 (Bauplan F.1, PD-017): Karte meldet ihre Anzeige an HA
  - title: Karte
    path: reinigen
    subview: true
    back_path: /dreame-x60/start
    type: panel
    cards:
      - type: custom:dreame-x60-panel
        page: reinigen
        diagnose: true  # Diagnose-Protokoll Schicht 3 (Bauplan F.1, PD-017): Karte meldet ihre Anzeige an HA
  - title: Planer
    path: planer
    subview: true
    back_path: /dreame-x60/start
    type: panel
    cards:
      - type: custom:dreame-x60-panel
        page: planer
        diagnose: true  # Diagnose-Protokoll Schicht 3 (Bauplan F.1, PD-017): Karte meldet ihre Anzeige an HA
  - title: Verlauf
    path: protokoll
    subview: true
    back_path: /dreame-x60/start
    type: panel
    cards:
      - type: custom:dreame-x60-panel
        page: protokoll
        diagnose: true  # Diagnose-Protokoll Schicht 3 (Bauplan F.1, PD-017): Karte meldet ihre Anzeige an HA
  - title: Prognose
    path: prognose
    subview: true
    back_path: /dreame-x60/start
    type: panel
    cards:
      - type: custom:dreame-x60-panel
        page: prognose
        diagnose: true  # Diagnose-Protokoll Schicht 3 (Bauplan F.1, PD-017): Karte meldet ihre Anzeige an HA
  - title: Einstellungen
    path: einstellungen
    subview: true
    back_path: /dreame-x60/start
    type: panel
    cards:
      - type: custom:dreame-x60-panel
        page: einstellungen
        diagnose: true  # Diagnose-Protokoll Schicht 3 (Bauplan F.1, PD-017): Karte meldet ihre Anzeige an HA
  # Seite „Dev“ (F.2b, PD-018): Diagnose-Protokoll, Tickets – die Karte zeigt sie nur Admin-Benutzern (alle anderen sehen die Übersicht)
  - title: Dev
    path: dev
    subview: true
    back_path: /dreame-x60/start
    type: panel
    cards:
      - type: custom:dreame-x60-panel
        page: dev
        diagnose: true
