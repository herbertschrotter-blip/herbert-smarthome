# ═══════════════════════════════════════════════════════════════════════
#  Heidi (Dreame X60) – Paket: Helfer, Sensoren, Prognose   (v2 – Planer-Editor)
#  Wird über "homeassistant: packages:" in configuration.yaml geladen.
# ═══════════════════════════════════════════════════════════════════════

# Personen werden über die Oberfläche verwaltet (Einstellungen → Personen)

# ── Schalter ────────────────────────────────────────────────────────────
input_boolean:
  heidi_automatik:
    name: Heidi Automatik
    icon: mdi:robot-vacuum
    initial: true
  heidi_dark_mode:
    name: Heidi Dark Mode
    icon: mdi:weather-night
    initial: true
  heidi_planer_bereich:
    name: Heidi Planer-Bereich anzeigen
    icon: mdi:calendar-check
    initial: true
  heidi_prognose_aktiv:
    name: Heidi Prognose aktiv
    icon: mdi:chart-timeline-variant
  heidi_abweichung_heute:
    name: Heidi Abweichung heute
    icon: mdi:calendar-remove
  heidi_nina_zaehlt:
    name: Nina zählt für Anwesenheit
    icon: mdi:account
    initial: true
  heidi_prog_herbert:
    name: Prognose Herbert einbeziehen
    initial: true
  heidi_prog_nicole:
    name: Prognose Nicole einbeziehen
    initial: true
  heidi_prog_nina:
    name: Prognose Nina einbeziehen
    initial: true
  # intern
  heidi_auto_lauf:
    name: Heidi Automatik-Lauf aktiv
    icon: mdi:play-circle
  heidi_auto_teil:
    name: Heidi Automatik-Lauf war Teilreinigung
    icon: mdi:circle-half-full
  # Planer-Einträge 1–4
  heidi_plan1_aktiv: { name: "Plan 1 aktiv", initial: true }
  heidi_plan1_schnell: { name: "Plan 1 Schnellprogramm erlaubt", initial: true }
  heidi_plan2_aktiv: { name: "Plan 2 aktiv", initial: true }
  heidi_plan2_schnell: { name: "Plan 2 Schnellprogramm erlaubt", initial: true }
  heidi_plan3_aktiv: { name: "Plan 3 aktiv" }
  heidi_plan3_schnell: { name: "Plan 3 Schnellprogramm erlaubt" }
  heidi_plan4_aktiv: { name: "Plan 4 aktiv" }
  heidi_plan4_schnell: { name: "Plan 4 Schnellprogramm erlaubt" }

# ── Auswahllisten ───────────────────────────────────────────────────────
input_select:
  heidi_kartendarstellung:
    name: Heidi Kartendarstellung
    icon: mdi:map
    options: [Dreame-App, Xiaomi-Karte, Nur Bild]
    initial: Dreame-App
  heidi_raumnamen:
    name: Heidi Raumnamen
    icon: mdi:translate
    options: [Original, Deutsch]
    initial: Deutsch
  heidi_bei_heimkehr:
    name: Heidi bei Heimkehr während Reinigung
    icon: mdi:home-import-outline
    options: [Zur Station, Weiterreinigen, Pausieren]
    initial: Zur Station
  # Planer-Einträge: Programm
  heidi_plan1_modus:
    name: Plan 1 Modus
    options: &modus [Saugen, Saugen + Wischen, "Saugen, dann Wischen", Nur Wischen]
    initial: Saugen
  heidi_plan1_saugstufe:
    name: Plan 1 Saugstufe
    options: &saug [Leise, Standard, Stark, Turbo]
    initial: Turbo
  heidi_plan1_wasser:
    name: Plan 1 Wassermenge
    options: &wasser [Wenig, Mittel, Viel]
    initial: Mittel
  heidi_plan1_route:
    name: Plan 1 Route
    options: &route [Schnell, Standard, Intensiv, Tief]
    initial: Standard
  heidi_plan1_wiederholungen:
    name: Plan 1 Wiederholungen
    options: &wdh ["1", "2", "3"]
    initial: "1"
  # Planer-Einträge: Homeoffice-Verhalten + Profil "Leise starten"
  heidi_plan1_homeoffice:
    name: Plan 1 bei Homeoffice
    options: &ho [Warten, Leise starten]
    initial: Warten
  heidi_plan1_ho_saug: { name: Plan 1 Leise-Saugstufe, options: &saug3 [Leise, Standard, Stark], initial: Leise }
  heidi_plan1_ho_route: { name: Plan 1 Leise-Route, options: &route3 [Schnell, Standard, Intensiv], initial: Schnell }
  heidi_plan1_ho_wdh: { name: Plan 1 Leise-Wiederholungen, options: &wdh2 ["1", "2"], initial: "1" }
  # Planer-Einträge: Profil "Schnellprogramm"
  heidi_plan1_sp_saug: { name: Plan 1 Schnell-Saugstufe, options: *saug3, initial: Standard }
  heidi_plan1_sp_route: { name: Plan 1 Schnell-Route, options: *route3, initial: Schnell }
  heidi_plan1_sp_wdh: { name: Plan 1 Schnell-Wiederholungen, options: *wdh2, initial: "1" }

  heidi_plan2_modus: { name: Plan 2 Modus, options: *modus, initial: Saugen + Wischen }
  heidi_plan2_saugstufe: { name: Plan 2 Saugstufe, options: *saug, initial: Turbo }
  heidi_plan2_wasser: { name: Plan 2 Wassermenge, options: *wasser, initial: Mittel }
  heidi_plan2_route: { name: Plan 2 Route, options: *route, initial: Standard }
  heidi_plan2_wiederholungen: { name: Plan 2 Wiederholungen, options: *wdh, initial: "1" }
  heidi_plan2_homeoffice: { name: Plan 2 bei Homeoffice, options: *ho, initial: Warten }
  heidi_plan2_ho_saug: { name: Plan 2 Leise-Saugstufe, options: *saug3, initial: Leise }
  heidi_plan2_ho_route: { name: Plan 2 Leise-Route, options: *route3, initial: Schnell }
  heidi_plan2_ho_wdh: { name: Plan 2 Leise-Wiederholungen, options: *wdh2, initial: "1" }
  heidi_plan2_sp_saug: { name: Plan 2 Schnell-Saugstufe, options: *saug3, initial: Standard }
  heidi_plan2_sp_route: { name: Plan 2 Schnell-Route, options: *route3, initial: Schnell }
  heidi_plan2_sp_wdh: { name: Plan 2 Schnell-Wiederholungen, options: *wdh2, initial: "1" }

  heidi_plan3_modus: { name: Plan 3 Modus, options: *modus, initial: Saugen + Wischen }
  heidi_plan3_saugstufe: { name: Plan 3 Saugstufe, options: *saug, initial: Turbo }
  heidi_plan3_wasser: { name: Plan 3 Wassermenge, options: *wasser, initial: Mittel }
  heidi_plan3_route: { name: Plan 3 Route, options: *route, initial: Standard }
  heidi_plan3_wiederholungen: { name: Plan 3 Wiederholungen, options: *wdh, initial: "2" }
  heidi_plan3_homeoffice: { name: Plan 3 bei Homeoffice, options: *ho, initial: Warten }
  heidi_plan3_ho_saug: { name: Plan 3 Leise-Saugstufe, options: *saug3, initial: Leise }
  heidi_plan3_ho_route: { name: Plan 3 Leise-Route, options: *route3, initial: Schnell }
  heidi_plan3_ho_wdh: { name: Plan 3 Leise-Wiederholungen, options: *wdh2, initial: "1" }
  heidi_plan3_sp_saug: { name: Plan 3 Schnell-Saugstufe, options: *saug3, initial: Standard }
  heidi_plan3_sp_route: { name: Plan 3 Schnell-Route, options: *route3, initial: Schnell }
  heidi_plan3_sp_wdh: { name: Plan 3 Schnell-Wiederholungen, options: *wdh2, initial: "1" }

  heidi_plan4_modus: { name: Plan 4 Modus, options: *modus, initial: Saugen + Wischen }
  heidi_plan4_saugstufe: { name: Plan 4 Saugstufe, options: *saug, initial: Turbo }
  heidi_plan4_wasser: { name: Plan 4 Wassermenge, options: *wasser, initial: Viel }
  heidi_plan4_route: { name: Plan 4 Route, options: *route, initial: Intensiv }
  heidi_plan4_wiederholungen: { name: Plan 4 Wiederholungen, options: *wdh, initial: "3" }
  heidi_plan4_homeoffice: { name: Plan 4 bei Homeoffice, options: *ho, initial: Warten }
  heidi_plan4_ho_saug: { name: Plan 4 Leise-Saugstufe, options: *saug3, initial: Leise }
  heidi_plan4_ho_route: { name: Plan 4 Leise-Route, options: *route3, initial: Schnell }
  heidi_plan4_ho_wdh: { name: Plan 4 Leise-Wiederholungen, options: *wdh2, initial: "1" }
  heidi_plan4_sp_saug: { name: Plan 4 Schnell-Saugstufe, options: *saug3, initial: Standard }
  heidi_plan4_sp_route: { name: Plan 4 Schnell-Route, options: *route3, initial: Schnell }
  heidi_plan4_sp_wdh: { name: Plan 4 Schnell-Wiederholungen, options: *wdh2, initial: "1" }

# ── Texte, Zeiten, Zahlen ───────────────────────────────────────────────
input_text:
  heidi_plan1_name: { name: Plan 1 Name, initial: Tägliches Saugen, max: 40 }
  heidi_plan2_name: { name: Plan 2 Name, initial: Saugen + Wischen, max: 40 }
  heidi_plan3_name: { name: Plan 3 Name, initial: Küche nach dem Kochen, max: 40 }
  heidi_plan4_name: { name: Plan 4 Name, initial: Bad & WC gründlich, max: 40 }
  # Räume: Raum-IDs mit Komma (1 Bad, 2 Schlafzimmer, 3 WC, 4 Flur, 5 Büro, 6 Küche, 7 Wohnzimmer)
  heidi_plan1_raeume: { name: Plan 1 Räume, initial: "7,6,5,4,3,2,1", max: 40 }
  heidi_plan2_raeume: { name: Plan 2 Räume, initial: "7,6,5,4,3,2,1", max: 40 }
  heidi_plan3_raeume: { name: Plan 3 Räume, initial: "6,4", max: 40 }
  heidi_plan4_raeume: { name: Plan 4 Räume, initial: "1,3", max: 40 }
  # Wochentage als Maske Mo..So ("1111100" = Mo–Fr, "0000000" = nur manuell)
  heidi_plan1_tage: { name: Plan 1 Tage, initial: "0110111", max: 7 }
  heidi_plan2_tage: { name: Plan 2 Tage, initial: "1001000", max: 7 }
  heidi_plan3_tage: { name: Plan 3 Tage, initial: "0000000", max: 7 }
  heidi_plan4_tage: { name: Plan 4 Tage, initial: "0000000", max: 7 }
  # Personen, bei deren Anwesenheit NICHT gefahren wird (herbert, nicole, nina)
  heidi_plan1_personen: { name: Plan 1 stört, initial: "nicole", max: 40 }
  heidi_plan2_personen: { name: Plan 2 stört, initial: "nicole", max: 40 }
  heidi_plan3_personen: { name: Plan 3 stört, initial: "", max: 40 }
  heidi_plan4_personen: { name: Plan 4 stört, initial: "", max: 40 }
  heidi_auto_letzter_plan: { name: Heidi zuletzt gestarteter Plan, max: 60 }

input_datetime:
  heidi_arbeitszeit_start: { name: Heidi Arbeitszeit Beginn, has_date: false, has_time: true, initial: "08:00:00" }
  heidi_arbeitszeit_ende: { name: Heidi Arbeitszeit Ende, has_date: false, has_time: true, initial: "17:00:00" }
  heidi_rueckkehr: { name: Heidi übliche Rückkehr, has_date: false, has_time: true, initial: "17:00:00" }
  heidi_letzte_auto_reinigung: { name: Heidi letzte Automatik-Reinigung, has_date: true, has_time: false, initial: "2000-01-01" }
  heidi_plan1_zeit: { name: Plan 1 Uhrzeit, has_date: false, has_time: true, initial: "09:30:00" }
  heidi_plan2_zeit: { name: Plan 2 Uhrzeit, has_date: false, has_time: true, initial: "09:30:00" }
  heidi_plan3_zeit: { name: Plan 3 Uhrzeit, has_date: false, has_time: true, initial: "19:30:00" }
  heidi_plan4_zeit: { name: Plan 4 Uhrzeit, has_date: false, has_time: true, initial: "10:30:00" }

input_number:
  heidi_schnell_minuten:
    name: Heidi Schnellprogramm wenn weniger als
    min: 30
    max: 240
    step: 15
    initial: 90
    unit_of_measurement: min
    icon: mdi:flash
  heidi_min_akku:
    name: Heidi Mindest-Akku
    min: 10
    max: 80
    step: 5
    initial: 30
    unit_of_measurement: "%"
    icon: mdi:battery-30
  # Prognose-Parameter (Dashboard-Einstellungen → Prognose)
  heidi_prognose_intervall:
    name: Prognose Protokoll-Intervall
    min: 5
    max: 60
    step: 5
    initial: 15
    unit_of_measurement: min
    icon: mdi:timer-outline
  heidi_prognose_aufloesung:
    name: Prognose Auflösung
    min: 15
    max: 60
    step: 15
    initial: 30
    unit_of_measurement: min
    icon: mdi:view-grid-outline
  heidi_prognose_wochen:
    name: Prognose Lernzeitraum
    min: 2
    max: 12
    step: 1
    initial: 8
    unit_of_measurement: Wochen
    icon: mdi:calendar-range
  heidi_prognose_halbwert:
    name: Prognose Gewichtung (Halbwertszeit)
    min: 7
    max: 60
    step: 1
    initial: 21
    unit_of_measurement: Tage
    icon: mdi:scale-balance
  heidi_prognose_mindesttage:
    name: Prognose Mindesttage bis aktiv
    min: 3
    max: 28
    step: 1
    initial: 14
    unit_of_measurement: Tage
    icon: mdi:school

# ── Berechnete Sensoren ─────────────────────────────────────────────────
template:
  - binary_sensor:
      - name: Heidi jemand zu Hause
        unique_id: heidi_jemand_zu_hause
        icon: mdi:home-account
        state: >-
          {{ is_state('person.herbert_schrotter', 'home')
             or is_state('person.nicole_2', 'home')
             or (is_state('input_boolean.heidi_nina_zaehlt', 'on') and is_state('person.nina_2', 'home')) }}
        attributes:
          zu_hause: >-
            {% set ns = namespace(l=[]) %}
            {% if is_state('person.herbert_schrotter','home') %}{% set ns.l = ns.l + ['Herbert'] %}{% endif %}
            {% if is_state('person.nicole_2','home') %}{% set ns.l = ns.l + ['Nicole'] %}{% endif %}
            {% if is_state('input_boolean.heidi_nina_zaehlt','on') and is_state('person.nina_2','home') %}{% set ns.l = ns.l + ['Nina'] %}{% endif %}
            {{ ns.l | join(', ') }}
      - name: Heidi Arbeitszeit
        unique_id: heidi_arbeitszeit
        icon: mdi:briefcase-clock
        state: >-
          {% set t = now().strftime('%H:%M:%S') %}
          {{ now().weekday() < 5
             and t >= states('input_datetime.heidi_arbeitszeit_start')
             and t < states('input_datetime.heidi_arbeitszeit_ende') }}
      - name: Heidi Nicht stören
        unique_id: heidi_nicht_stoeren
        icon: mdi:sleep
        state: >-
          {% set t = now().strftime('%H:%M:%S') %}{% set a = states('time.heidi_dnd_start') %}{% set e = states('time.heidi_dnd_end') %}{{ false if (a in ['unknown','unavailable'] or e in ['unknown','unavailable']) else ((t >= a and t < e) if a <= e else (t >= a or t < e)) }}
  - sensor:
      - name: Heidi heutiger Plan
        unique_id: heidi_heutiger_plan
        icon: mdi:calendar-today
        state: >-
          {% set ns = namespace(slot=0, best='99:99:99') %}
          {% for i in [1,2,3,4] %}
            {% set mask = states('input_text.heidi_plan' ~ i ~ '_tage') %}
            {% if is_state('input_boolean.heidi_plan' ~ i ~ '_aktiv','on') and mask | length == 7 and mask[now().weekday()] == '1' %}
              {% set t = states('input_datetime.heidi_plan' ~ i ~ '_zeit') %}
              {% if t < ns.best %}{% set ns.slot = i %}{% set ns.best = t %}{% endif %}
            {% endif %}
          {% endfor %}
          {{ ns.slot }}
        attributes:
          name: "{{ states('input_text.heidi_plan' ~ states('sensor.heidi_heutiger_plan') ~ '_name') if states('sensor.heidi_heutiger_plan') != '0' else 'kein Eintrag' }}"
          zeit: "{{ states('input_datetime.heidi_plan' ~ states('sensor.heidi_heutiger_plan') ~ '_zeit')[:5] if states('sensor.heidi_heutiger_plan') != '0' else '' }}"
          erledigt: "{{ states('input_datetime.heidi_letzte_auto_reinigung') == now().date() | string }}"
          # Personen des heutigen Eintrags, die gerade zu Hause sind ("stören")
          stoerer: >-
            {% set slot = states('sensor.heidi_heutiger_plan') %}
            {% if slot == '0' %}{{ [] }}{% else %}
            {% set sel = states('input_text.heidi_plan' ~ slot ~ '_personen').split(',') | map('trim') | list %}
            {% set ns = namespace(l=[]) %}
            {% if 'herbert' in sel and is_state('person.herbert_schrotter','home') %}{% set ns.l = ns.l + ['Herbert'] %}{% endif %}
            {% if 'nicole' in sel and is_state('person.nicole_2','home') %}{% set ns.l = ns.l + ['Nicole'] %}{% endif %}
            {% if 'nina' in sel and is_state('person.nina_2','home') %}{% set ns.l = ns.l + ['Nina'] %}{% endif %}
            {{ ns.l }}{% endif %}

      - name: Heidi Automatik Status
        unique_id: heidi_automatik_status
        icon: mdi:robot-vacuum-variant
        state: >-
          {% set slot = states('sensor.heidi_heutiger_plan') %}
          {% set erledigt = state_attr('sensor.heidi_heutiger_plan','erledigt') %}
          {% set stoerer = state_attr('sensor.heidi_heutiger_plan','stoerer') or [] %}
          {% set blockiert = stoerer | length > 0 %}
          {% set ho = blockiert and is_state('binary_sensor.heidi_arbeitszeit','on') %}
          {% set name = state_attr('sensor.heidi_heutiger_plan','name') %}
          {% set zeit = state_attr('sensor.heidi_heutiger_plan','zeit') %}
          {% set now_t = now().strftime('%H:%M') %}
          {% if is_state('input_boolean.heidi_automatik','off') %}Automatik aus
          {% elif slot == '0' %}Heute kein geplanter Eintrag
          {% elif erledigt %}„{{ name }}“ heute erledigt
          {% elif is_state('input_boolean.heidi_auto_lauf','on') %}„{{ name }}“ läuft
          {% elif is_state('binary_sensor.heidi_nicht_stoeren','on') %}Nicht-stören-Zeit – wartet
          {% elif now_t < zeit %}Wartet auf „{{ name }}“ um {{ zeit }}
          {% elif states('sensor.heidi_battery_level') | int(0) < states('input_number.heidi_min_akku') | int(30) %}Akku zu niedrig – wartet
          {% elif not blockiert %}„{{ name }}“ startet
          {% elif ho and is_state('input_select.heidi_plan' ~ slot ~ '_homeoffice','Leise starten') %}Homeoffice – startet leise
          {% elif ho %}Homeoffice ({{ stoerer | join(', ') }}) – wartet
          {% else %}Wartet, bis {{ stoerer | join(' und ') }} weg {{ 'ist' if stoerer | length == 1 else 'sind' }}{% endif %}
        attributes:
          detail: >-
            {% set jemand = state_attr('binary_sensor.heidi_jemand_zu_hause','zu_hause') %}
            {% set rk = states('input_datetime.heidi_rueckkehr')[:5] %}
            {% set prog = state_attr('sensor.heidi_prognose','rueckkehr') %}
            {% set use_prog = is_state('input_boolean.heidi_prognose_aktiv','on') and is_state('input_boolean.heidi_abweichung_heute','off') and (state_attr('sensor.heidi_prognose','tage') | int(0)) >= (states('input_number.heidi_prognose_mindesttage') | int(14)) and prog not in [none, '', '–'] %}
            {% set rest = state_attr('sensor.heidi_prognose','rueckkehr_min') | int(0) if use_prog else ((rk[:2] | int) * 60 + (rk[3:5] | int) - now().hour * 60 - now().minute) %}
            {% set schnell = rest < states('input_number.heidi_schnell_minuten') | int(90) %}
            {{ 'Zu Hause: ' ~ jemand ~ '. ' if jemand else 'Niemand zu Hause. ' }}
            {{ 'Prognose: Rückkehr ' ~ prog if use_prog else 'Übliche Rückkehr ' ~ rk }}
            ({{ (rest // 60) if rest > 0 else 0 }} h {{ (rest % 60) if rest > 0 else 0 }} min) →
            {{ 'Schnellprogramm' if schnell else 'volles Programm' }}.

# ── Prognose: Protokoll + Auswertung (Skript unter /config/prognose/) ──
shell_command:
  heidi_prognose_log: >-
    python3 /config/prognose/presence.py log
    "{{ states('person.herbert_schrotter') }}" "{{ states('person.nicole_2') }}" "{{ states('person.nina_2') }}"
  heidi_prognose_config: >-
    python3 /config/prognose/presence.py config
    "{{ states('input_boolean.heidi_prog_herbert') }}" "{{ states('input_boolean.heidi_prog_nicole') }}" "{{ states('input_boolean.heidi_prog_nina') }}"
    "{{ states('input_number.heidi_prognose_wochen') | int(8) }}" "{{ states('input_number.heidi_prognose_halbwert') | int(21) }}" "{{ states('input_number.heidi_prognose_aufloesung') | int(30) }}"
  heidi_prognose_reset: python3 /config/prognose/presence.py reset

command_line:
  - sensor:
      name: Heidi Prognose
      unique_id: heidi_prognose
      command: python3 /config/prognose/presence.py forecast
      scan_interval: 1800
      command_timeout: 60
      value_template: "{{ value_json.state }}"
      json_attributes:
        - tage
        - freies_fenster
        - rueckkehr
        - rueckkehr_min
        - rueckkehr_wer
        - sicherheit
        - homeoffice
        - empfehlung
        - aktualisiert
        - aufloesung
        - wochen
