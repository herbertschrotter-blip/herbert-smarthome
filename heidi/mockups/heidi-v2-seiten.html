<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heidi v2 – alle Seiten (Mockup, iOS-Stil)</title>
<style>
  :root {
    --bg1: #0b1020; --bg2: #101a3a; --bg3: #0f3d4a; --bg4: #3a1a5a;
    --glass: rgba(255,255,255,.10); --glass-2: rgba(255,255,255,.14); --glass-3: rgba(255,255,255,.22);
    --line: rgba(255,255,255,.18); --line-soft: rgba(255,255,255,.10);
    --text: #f5f7fa; --muted: rgba(245,247,250,.62); --muted-2: rgba(245,247,250,.42);
    --accent: #34d3b8; --accent-ink: #0b1020; --blue: #5ab0ff; --good: #34d17a; --warn: #ffb340; --bad: #ff6b6b; --purple: #b48cff;
    --shadow: 0 18px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.18);
    --r: 24px; --r-s: 16px; --ring-bg: #16223a; --sheet: rgba(22,30,50,.86);
  }
  .light {
    --bg1: #dfe9f7; --bg2: #eef3fb; --bg3: #cfeee7; --bg4: #e6d9f5;
    --glass: rgba(255,255,255,.55); --glass-2: rgba(255,255,255,.65); --glass-3: rgba(255,255,255,.85);
    --line: rgba(20,40,60,.12); --line-soft: rgba(20,40,60,.08);
    --text: #12203a; --muted: rgba(18,32,58,.62); --muted-2: rgba(18,32,58,.42);
    --accent: #0ea892; --accent-ink: #ffffff; --blue: #2f6fd0; --good: #1f9a58; --warn: #d98c1a; --bad: #d64545; --purple: #6f45d6;
    --shadow: 0 14px 32px rgba(20,40,60,.14), inset 0 1px 0 rgba(255,255,255,.8); --ring-bg: #f4f7fb; --sheet: rgba(245,248,252,.92);
  }
  * { box-sizing: border-box; min-width: 0; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: -apple-system, "SF Pro Text", "SF Pro Display", system-ui, "Segoe UI", Roboto, sans-serif; color: var(--text); font-size: 15px; line-height: 1.35;
    -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; background: var(--bg1); }
  button { font: inherit; color: inherit; }
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 45%, var(--bg1) 100%); }
  .bg i { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .75; }
  .bg i:nth-child(1) { width: 60vmax; height: 60vmax; left: -20vmax; top: -25vmax; background: var(--bg3); }
  .bg i:nth-child(2) { width: 55vmax; height: 55vmax; right: -20vmax; top: 10vmax; background: var(--bg4); }
  .bg i:nth-child(3) { width: 50vmax; height: 50vmax; left: 20vmax; bottom: -30vmax; background: var(--bg3); opacity: .5; }

  /* Mockup-Leiste */
  .tools { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px; background: rgba(0,0,0,.4);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); color: #fff; font-size: 12px; border-bottom: 1px solid rgba(255,255,255,.12); }
  .tools b { opacity: .7; margin-right: 4px; }
  .tools .seg { display: inline-flex; background: rgba(255,255,255,.14); border-radius: 10px; padding: 2px; }
  .tools .seg button { border: 0; background: transparent; color: #fff; padding: 5px 10px; border-radius: 8px; cursor: pointer; }
  .tools .seg button.on { background: rgba(255,255,255,.92); color: #111; font-weight: 600; }

  /* Seite / Gerät */
  .page { max-width: 1120px; margin: 0 auto; padding: 18px 16px 48px; container-type: inline-size; position: relative; }
  .page.phone { max-width: 393px; padding: 0; border-radius: 44px; overflow: hidden; margin: 18px auto; box-shadow: 0 0 0 10px #111, 0 30px 60px rgba(0,0,0,.6);
    background: radial-gradient(70% 40% at 10% 0%, var(--bg3), transparent 70%), radial-gradient(70% 45% at 100% 35%, var(--bg4), transparent 70%), radial-gradient(60% 40% at 30% 100%, var(--bg3), transparent 70%), linear-gradient(160deg, var(--bg1), var(--bg2) 50%, var(--bg1)); }
  .page.phone .inner { padding: 8px 12px 40px; min-height: 700px; }
  .statusbar { display: none; }
  .page.phone .statusbar { display: flex; justify-content: space-between; align-items: center; padding: 14px 26px 0; font-size: 14px; font-weight: 600; }
  .page.phone .statusbar .notch { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); width: 120px; height: 34px; background: #111; border-radius: 20px; }
  .page.phone .homebar { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); width: 130px; height: 5px; border-radius: 3px; background: var(--text); opacity: .5; }

  /* Kopfzeilen */
  .head { display: flex; align-items: flex-end; justify-content: space-between; padding: 14px 4px 10px; gap: 10px; }
  .head h1 { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -.02em; }
  .head .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--glass); display: grid; place-items: center; cursor: pointer; flex: none;
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
  .iconbtn svg { width: 20px; height: 20px; }
  .navbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 10px 0 12px; }
  .navbar .back { justify-self: start; display: inline-flex; align-items: center; gap: 2px; border: 0; background: transparent; color: var(--accent); font-size: 17px; padding: 6px 4px; cursor: pointer; }
  .navbar .back svg { width: 22px; height: 22px; }
  .navbar h1 { margin: 0; font-size: 17px; font-weight: 700; text-align: center; }
  .navbar .r { justify-self: end; }

  /* Glas */
  .card { position: relative; background: var(--glass); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px;
    backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%); }
  .card h2 { margin: 0 0 10px; font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card h2 .r { font-weight: 500; letter-spacing: 0; text-transform: none; }
  .grid { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
  @container (min-width: 880px) { .grid { grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); } .grid.even { grid-template-columns: 1fr 1fr; } }
  .col { display: grid; gap: 14px; align-content: start; }

  /* Hero */
  .hero { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
  .ring { --p: 62; width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; position: relative; background: conic-gradient(var(--rc, var(--accent)) calc(var(--p) * 1%), rgba(255,255,255,.12) 0); }
  .ring::before { content: ""; position: absolute; inset: 10px; border-radius: 50%; background: var(--ring-bg); }
  .ring .num { position: relative; z-index: 1; font-size: 26px; font-weight: 700; letter-spacing: -.02em; text-align: center; line-height: 1; }
  .ring .num small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); margin-top: 3px; }
  .status .big { font-size: 24px; font-weight: 700; letter-spacing: -.02em; display: flex; align-items: center; gap: 10px; }
  .status .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 5px color-mix(in srgb, var(--good) 25%, transparent); flex: none; }
  .status .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: var(--glass-2); border: 1px solid var(--line-soft); font-size: 12px; color: var(--muted); cursor: default; }
  .chip svg { width: 14px; height: 14px; }
  .chip.on { color: var(--text); background: var(--glass-3); }
  .chip.acc { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
  .chip.k { color: var(--text); }
  button.chip { cursor: pointer; }
  .ctl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .btn { border: 1px solid var(--line); background: var(--glass-2); color: var(--text); border-radius: 14px; padding: 12px 8px; font-weight: 600; font-size: 14px; white-space: nowrap;
    display: inline-flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer; transition: transform .08s ease; }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .btn.danger { color: var(--bad); }
  .btn.sm { padding: 8px 12px; font-size: 13px; border-radius: 12px; }
  .btn svg { width: 18px; height: 18px; }
  .strip { margin-top: 14px; padding: 10px 12px; border-radius: 16px; background: var(--glass-2); border: 1px solid var(--line-soft); cursor: pointer; }
  .strip .lab { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
  .strip .lab svg { width: 16px; height: 16px; flex: none; }
  .livemap { margin-top: 12px; cursor: pointer; }
  .livemap .map { border-radius: var(--r-s); } .livemap .map > svg { width: 100%; height: auto; }
  .livemap .cap { margin-top: 6px; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; } .livemap .cap b { color: var(--text); }
  .livemap .cap svg { width: 14px; height: 14px; }
  .strip .lab .r { margin-left: auto; color: var(--muted); font-weight: 500; }
  .strip .chips { margin-top: 8px; }

  /* Listen im iOS-Stil */
  .list { display: grid; gap: 1px; background: var(--line-soft); border-radius: var(--r-s); overflow: hidden; border: 1px solid var(--line-soft); }
  .row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; padding: 11px 14px; background: var(--glass); min-height: 46px; }
  .row .t { font-weight: 500; } .row .s { font-size: 12px; color: var(--muted); }
  .row .v { color: var(--muted); display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
  .row .v svg { width: 14px; height: 14px; color: var(--muted-2); }
  .row.link { cursor: pointer; }
  .sw { width: 52px; height: 32px; border-radius: 16px; background: rgba(120,120,128,.32); position: relative; cursor: pointer; transition: background .2s; flex: none; border: 0; padding: 0; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 28px; height: 28px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.3); transition: left .2s; }
  .sw.on { background: var(--good); } .sw.on::after { left: 22px; }
  .seg2 { display: inline-flex; background: rgba(120,120,128,.22); border-radius: 10px; padding: 2px; gap: 2px; max-width: 100%; }
  .seg2 button { border: 0; background: transparent; color: var(--text); padding: 6px 10px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
  .seg2 button.on { background: var(--glass-3); font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
  .seg2.dis { opacity: .4; pointer-events: none; }
  input[type=range] { accent-color: var(--accent); width: 130px; }
  input[type=time], input[type=text], select { font: inherit; color: var(--text); background: var(--glass-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .light input, .light select { color-scheme: light; } input, select { color-scheme: dark; }

  /* Kacheln */
  .tiles { display: grid; gap: 8px; grid-template-columns: repeat(4, 1fr); }
  .tiles.three { grid-template-columns: repeat(3, 1fr); }
  @container (max-width: 520px) { .tiles { grid-template-columns: repeat(2, 1fr); } .tiles.three { grid-template-columns: repeat(3, 1fr); } }
  .tile { background: var(--glass-2); border: 1px solid var(--line-soft); border-radius: var(--r-s); padding: 12px; min-height: 70px; }
  .tile .k { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; } .tile .k svg { width: 14px; height: 14px; flex: none; }
  .tile .v { font-size: 20px; font-weight: 700; margin-top: 6px; }
  .tile .v small { font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 3px; }
  .tile.warn { border-color: color-mix(in srgb, var(--warn) 45%, transparent); } .tile.warn .v { color: var(--warn); }
  .cons { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  @container (max-width: 520px) { .cons { grid-template-columns: repeat(3, 1fr); } }
  .cons button { border: 0; background: transparent; cursor: pointer; display: grid; justify-items: center; gap: 6px; padding: 6px 0; }
  .mini { --p: 80; --v: var(--accent); width: 54px; height: 54px; border-radius: 50%; position: relative; display: grid; place-items: center; background: conic-gradient(var(--v) calc(var(--p) * 1%), rgba(255,255,255,.12) 0); }
  .mini::before { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: var(--ring-bg); }
  .mini span { position: relative; z-index: 1; font-size: 13px; font-weight: 700; }
  .cons .l { font-size: 11px; color: var(--muted); }
  .nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  @container (max-width: 520px) { .nav { grid-template-columns: repeat(2, 1fr); } }
  .navtile { text-align: left; border: 1px solid var(--line); background: var(--glass); border-radius: var(--r); padding: 14px; min-height: 118px; cursor: pointer; display: grid; grid-template-rows: auto auto 1fr; align-content: start; gap: 8px;
    backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%); box-shadow: var(--shadow); transition: transform .08s ease; }
  .navtile:active { transform: scale(.97); }
  .navtile .ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: #fff; } .navtile .ic svg { width: 20px; height: 20px; }
  .navtile .t { font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; } .navtile .t svg { width: 16px; height: 16px; color: var(--muted-2); }
  .navtile .s { color: var(--muted); font-size: 13px; }
  .navtile .prog { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; align-self: end; } .navtile .prog div { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .navtile .prog b { display: block; font-size: 13px; color: var(--text); }
  .c-teal { background: linear-gradient(135deg, #2fd1b6, #178f7c); } .c-blue { background: linear-gradient(135deg, #5ab0ff, #2f6fd0); } .c-purple { background: linear-gradient(135deg, #b48cff, #6f45d6); }
  .c-orange { background: linear-gradient(135deg, #ffb340, #e2792a); } .c-gray { background: linear-gradient(135deg, #9aa5b5, #5f6c7d); }

  /* Karte (Grundriss) */
  .map { position: relative; border-radius: var(--r-s); overflow: hidden; background: rgba(0,0,0,.18); border: 1px solid var(--line-soft); }
  .map > svg { width: 100%; height: auto; display: block; }
  .map .room { fill: rgba(255,255,255,.08); stroke: rgba(255,255,255,.35); stroke-width: 1.2; cursor: pointer; transition: fill .15s; }
  .map .room.sel { fill: color-mix(in srgb, var(--accent) 45%, transparent); stroke: var(--accent); }
  .map .room.cur { fill: color-mix(in srgb, var(--blue) 40%, transparent); stroke: var(--blue); }
  .map text { fill: var(--text); font-size: 8px; font-weight: 600; pointer-events: none; }
  .map .zone { fill: rgba(255,107,107,.28); stroke: var(--bad); stroke-width: 1.2; stroke-dasharray: 4 3; }
  .map .nomop { fill: rgba(90,169,255,.25); stroke: var(--blue); stroke-width: 1.2; stroke-dasharray: 4 3; }
  .map .bot { fill: var(--accent); stroke: #fff; stroke-width: 1.5; }
  .map .dock { fill: var(--muted-2); }
  .map .mtools { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 6px; }
  .map .mtools .btn.sm { background: rgba(20,28,44,.72); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .map .mtools .btn.sm.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .mapmodes { display: flex; gap: 8px; align-items: center; margin-top: 10px; } .mapmodes .seg2 { flex: 1 1 auto; } .mapmodes .seg2 button { flex: 1; }
  .maps { display: inline-flex; gap: 2px; background: rgba(120,120,128,.22); border-radius: 8px; padding: 2px; } .maps button { border: 0; background: transparent; color: var(--muted); padding: 3px 8px; border-radius: 6px; font: inherit; font-size: 11px; font-weight: 500; cursor: pointer; } .maps button.on { color: var(--text); background: var(--glass-3); }
  .tabs { display: flex; gap: 2px; background: rgba(120,120,128,.22); border-radius: 10px; padding: 2px; margin-bottom: 10px; } .tabs button { flex: 1; border: 0; background: transparent; color: var(--text); padding: 8px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; } .tabs button.on { background: var(--glass-3); font-weight: 600; }
  .rooms { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 10px; }
  @container (max-width: 640px) { .rooms { grid-template-columns: repeat(4, 1fr); } }
  .rooms button { border: 1px solid var(--line-soft); background: var(--glass-2); border-radius: 12px; padding: 9px 4px 7px; display: grid; justify-items: center; gap: 4px; font-size: 11px; cursor: pointer; position: relative; }
  .rooms button svg { width: 18px; height: 18px; } .rooms button.sel { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .rooms .dotm { position: absolute; top: 5px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .runbar { display: flex; gap: 8px; margin-top: 10px; align-items: center; }

  /* Planer */
  .plan { display: grid; gap: 8px; }
  .pr { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto auto; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-s); background: var(--glass-2); border: 1px solid var(--line-soft); }
  .pr.today { border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
  .pr.off { opacity: .55; }
  .pr .ic { width: 38px; height: 38px; border-radius: 11px; background: var(--glass-3); display: grid; place-items: center; color: var(--accent); } .pr .ic svg { width: 20px; height: 20px; }
  .pr .ic.blue { color: var(--blue); }
  .pr .n { font-weight: 600; } .pr .s { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
  .pr .tag { font-size: 11px; padding: 4px 8px; border-radius: 999px; background: var(--glass-3); color: var(--muted); white-space: nowrap; } .pr .tag.acc { color: var(--accent); }
  .pr .acts { display: flex; gap: 4px; }
  .ib { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line-soft); background: var(--glass-2); display: grid; place-items: center; cursor: pointer; } .ib svg { width: 16px; height: 16px; } .ib.go { color: var(--accent); }
  .estline { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--accent); cursor: pointer; } .estline.bad { color: var(--bad); } .estline svg { width: 12px; height: 12px; }
  details { border-radius: var(--r-s); }
  summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); padding: 8px 4px; }
  summary::-webkit-details-marker { display: none; }
  summary svg { width: 14px; height: 14px; transition: transform .2s; } details[open] summary svg { transform: rotate(90deg); }

  /* Protokoll */
  .hist { display: grid; gap: 4px; }
  .hrow { display: grid; grid-template-columns: 1fr 58px 58px auto 22px; align-items: center; gap: 8px; font-size: 12px; padding: 8px 10px; border-radius: 10px; background: var(--glass-2); cursor: pointer; }
  .hrow .hd { color: var(--text); font-weight: 500; } .hrow .chip { padding: 2px 8px; }
  .hrow.open { background: var(--glass-3); }
  .tl { display: grid; gap: 2px; margin: 2px 0 6px 14px; padding-left: 10px; border-left: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); }
  .tlr { display: grid; grid-template-columns: 42px 1fr auto; gap: 8px; align-items: center; font-size: 12px; padding: 3px 6px; color: var(--muted); }
  .tlr .tt, .tlr .tx { color: var(--text); } .tlr .tx { font-weight: 500; } .tlr.now .tx { color: var(--accent); } .tlr .td { white-space: nowrap; }
  .lr { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 8px; font-size: 12px; padding: 6px 8px; border-radius: 8px; background: var(--glass-2); color: var(--muted); } .lr span:first-child { color: var(--text); font-weight: 500; }
  @container (max-width: 520px) { .lr { grid-template-columns: 1fr 1fr; } }

  /* Prognose */
  .heat { display: grid; grid-template-columns: 70px 1fr; gap: 6px 10px; align-items: center; }
  .heat .n { font-size: 13px; font-weight: 600; } .heat > svg { width: 100%; height: auto; border-radius: 8px; display: block; }
  .datab { height: 8px; border-radius: 4px; background: var(--glass-3); overflow: hidden; } .datab i { display: block; height: 100%; background: var(--accent); }

  /* Editor */

// Schätzung (vereinfacht wie v1: Raum für Raum)
function estimate(p, variante = 'normal', uniform = null) {
  const L = S.lern, F = { Leise: 0.8, Standard: 1, Stark: 1.25, Turbo: 1.6 };
  const std = variante === 'schnell' ? { modus: 'Saugen', saug: p.spSaug, wdh: p.spWdh } : variante === 'leise' ? { modus: 'Saugen', saug: p.hoSaug, wdh: p.hoWdh } : { modus: p.modus, saug: p.saug, wdh: p.wdh };
  const setting = (id) => uniform ? { ...std, ...uniform } : variante === 'normal' ? { ...std, ...(p.raum[id] || {}) } : std;
  const rate = (modus, saug) => { const r = L.raten[modus + '/' + saug]; if (r) return { m: r[0], b: r[1], gelernt: true }; const base = Object.entries(L.raten).find(([k]) => k.startsWith(modus + '/')); const bb = base ? { m: base[1][0], b: base[1][1], f: F[base[0].split('/')[1]] } : { m: modus === 'Saugen' ? 0.9 : 1.6, b: modus === 'Saugen' ? 0.3 : 0.42, f: 1 }; return { m: bb.m, b: bb.b * F[saug] / bb.f, gelernt: false }; };
  const order = [1, 6, 7, 2, 4, 3, 5].filter((i) => p.raeume.includes(i));
  const steps = []; let t = 0, batt = S.batt, since = 0, charges = 0, unlearned = 0;
  const wet = order.some((id) => setting(id).modus !== 'Saugen');
  if (wet) { steps.push({ typ: 'wasch', text: 'Wäscht Mopps vor dem Start', min: 4, batt }); t += 4; }
  for (const id of order) {
    const s = setting(id), r = rate(s.modus, s.saug), area = R(id).area, min = area * r.m * parseInt(s.wdh), drain = min * r.b; if (!r.gelernt) unlearned++;
    if (batt - drain < 15) { const c = (80 - batt) / 1.1 + 4; steps.push({ typ: 'laden', text: `Lädt ${Math.round(batt)} % → 80 %`, min: c, batt: 80 }); t += c; batt = 80; charges++; }
    batt -= drain; t += min; since += area;
    steps.push({ typ: 'raum', id, text: R(id).short, sub: `${s.modus} · ${s.saug} · ${s.wdh}×`, min, batt, area, gelernt: r.gelernt });
    if (s.modus !== 'Saugen' && since >= 25) { steps.push({ typ: 'wasch', text: 'Wäscht Mopps zwischendurch', min: 5, batt }); t += 5; since = 0; }
  }
  steps.push({ typ: 'heim', text: 'Fährt zur Station', min: 3, batt }); t += 3;
  return { steps, total: t, batt0: S.batt, battEnd: batt, charges, unlearned };
}

function heatSvg(seed) {
  let s = seed; const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  const W = 48, H = 7, cw = 10, ch = 10; let out = '';
  for (let d = 0; d < H; d++) for (let t = 0; t < W; t++) { const hour = t / 2, home = (hour < 7.5 || hour > 17 + rnd() * 2) ? 0.85 + rnd() * .15 : (d >= 5 ? 0.6 + rnd() * .3 : rnd() * .25); out += `<rect x="${t * cw}" y="${d * ch}" width="${cw - 1}" height="${ch - 1}" fill="rgba(52,211,184,${(home * .9).toFixed(2)})"/>`; }
  return `<svg viewBox="0 0 ${W * cw} ${H * ch}">${out}</svg>`;
}

    <div class="chips" style="margin-top:8px"><button class="btn sm danger" data-toast="Ausgewählte Zone gelöscht (Mockup)">Ausgewählte löschen</button><button class="btn sm danger" data-confirm="Wirklich alle Zonen dieses Typs löschen?">Alle löschen</button></div>`;
  return dlg('Sperrzonen bearbeiten', '', body, `<button class="btn" data-act="close">Abbrechen</button><button class="btn primary" data-act="zsave">Speichern</button>`, 'close', true);
}
function renderOverlay() {
  const o = S.overlay, el = $('#overlay'); if (!o) { el.innerHTML = ''; return; }
  if (o.kind === 'confirm') { el.innerHTML = `<div class="scrim" data-act="close"></div><div class="alert fade"><div class="m">${esc(o.msg)}${o.sub ? `<small>${esc(o.sub)}</small>` : ''}</div><div class="b"><button data-act="close">Abbrechen</button><button data-act="confirm-ok">OK</button></div></div>`; return; }
  if (o.kind === 'editor') el.innerHTML = editorHtml();
  else if (o.kind === 'rooms') el.innerHTML = roomsHtml(o);
  else if (o.kind === 'est') el.innerHTML = estHtml(o);
  else if (o.kind === 'zones') el.innerHTML = zonesHtml(o);
  else if (o.kind === 'saveError') el.innerHTML = `<div class="scrim" data-act="close"></div><div class="alert fade"><div class="m">Speichern unvollständig<small>Nicht übernommen: Wiederholungen, Uhrzeit. Verbindung prüfen und erneut speichern.</small></div><div class="b"><button data-act="close">Schließen</button><button data-act="save">Erneut</button></div></div>`;
}

// ───────── Rendern ─────────
const PAGES = { start: pageStart, reinigen: pageReinigen, planer: pagePlaner, protokoll: pageProtokoll, prognose: pagePrognose, einstellungen: pageEinstellungen };
function render() {
  document.body.classList.toggle('light', !S.dark);
  $('#page').classList.toggle('phone', S.phone);
  const p = PAGES[S.page] ? S.page : 'start';
  $('#inner').innerHTML = `<div class="fade">${PAGES[p]()}</div>`;
  document.querySelectorAll('#segPage button').forEach((b) => b.classList.toggle('on', b.dataset.v === p));
  document.querySelectorAll('#segState button').forEach((b) => b.classList.toggle('on', b.dataset.v === S.vac));
  document.querySelectorAll('#segTheme button').forEach((b) => b.classList.toggle('on', (b.dataset.v === 'dark') === S.dark));
  document.querySelectorAll('#segDevice button').forEach((b) => b.classList.toggle('on', (b.dataset.v === 'phone') === S.phone));
  renderOverlay();
  if (S.phone) $('#page').scrollIntoView({ block: 'start' });
}
function route() { const m = location.hash.match(/^#\/(\w+)/); S.page = m && PAGES[m[1]] ? m[1] : 'start'; S.overlay = null; S.draft = null; render(); }
window.addEventListener('hashchange', route);

// ───────── Ereignisse ─────────
document.querySelector('.tools').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return; const g = b.parentElement.id, v = b.dataset.v;
  if (g === 'segState') S.vac = v; else if (g === 'segTheme') S.dark = v === 'dark'; else if (g === 'segDevice') S.phone = v === 'phone'; else if (g === 'segPage') { nav(v); return; }
  render();
});
$('#page').addEventListener('click', async (e) => {
  const t = e.target.closest('[data-nav],[data-open],[data-toast],[data-confirm],[data-sw],[data-room],[data-act],[data-run],[data-tl],[data-seg],[data-ed],[data-rv]'); if (!t) return;
  const d = t.dataset;
  if (d.nav) { nav(d.nav); return; }
  if (d.open === 'editor') { const p = S.plans.find((x) => x.n === +d.n); S.draft = JSON.parse(JSON.stringify(p)); S.draft.clock = null; S.draft.changedOutside = false; S.overlay = { kind: 'editor' }; renderOverlay(); return; }
  if (d.open === 'rooms-robot') { S.overlay = { kind: 'rooms', mode: 'robot', back: d.back || null }; renderOverlay(); return; }
  if (d.open === 'rooms-plan') { S.overlay = { kind: 'rooms', mode: 'plan', back: 'editor' }; renderOverlay(); return; }
  if (d.open === 'est') { S.overlay = { kind: 'est', n: +d.n, cmp: false, back: d.back || null }; renderOverlay(); return; }
  if (d.open === 'zones') { S.overlay = { kind: 'zones', type: 'zones' }; renderOverlay(); return; }
  if (d.rv) { const o = S.overlay; if (o.mode === 'plan') { const e = S.draft, std = () => ({ modus: e.modus, saug: e.saug, wasser: e.wasser, route: e.route, wdh: e.wdh }); if (d.rv === 'own') { if (d.room === 'none') e.raum = {}; else if (e.raum[d.room]) delete e.raum[d.room]; else e.raum[d.room] = std(); } renderOverlay(); } return; }
  if (d.seg) {
    const [ns, key] = d.seg.includes(':') ? d.seg.split(':') : [null, d.seg];
    if (ns === 'ed') { S.draft[key] = d.val; renderOverlay(); return; }
    if (ns === 'rv') { const o = S.overlay; if (o.mode === 'plan') { const e = S.draft; if (!e.raum[d.room]) e.raum[d.room] = { modus: e.modus, saug: e.saug, wasser: e.wasser, route: e.route, wdh: e.wdh }; e.raum[d.room][key] = d.val; } else { const idx = { modus: 0, saug: 1, wasser: 2, route: 3, wdh: 4 }[key]; const ids = d.room === 'all' ? [1, 2, 3, 4, 5, 6, 7] : [+d.room]; ids.forEach((i) => { S.robotRooms[i][idx] = d.val; }); toast(d.room === 'all' ? 'Alle Räume gesetzt' : 'Gesetzt (select.select_option)'); } renderOverlay(); return; }
    if (key === 'theme') S.dark = d.val === 'Dunkel'; else if (key === 'kind') S.kind = d.val; else if (key === 'rotation') S.rotation = d.val.replace('°', ''); else if (key === 'raumnamen') S.raumnamen = d.val;
    toast('Gespeichert: ' + d.val); render(); return;
  }
  if (d.ed) {
    const e = S.draft;
    if (d.ed === 'room') { const id = +d.val; e.raeume = e.raeume.includes(id) ? e.raeume.filter((x) => x !== id) : [...e.raeume, id]; }
    else if (d.ed === 'day') e.tage[+d.val] = e.tage[+d.val] ? 0 : 1; else if (d.ed === 'preset') e.tage = [...d.val].map((c) => +c); else if (d.ed === 'person') e.personen = e.personen.includes(d.val) ? e.personen.filter((x) => x !== d.val) : [...e.personen, d.val];
    else if (d.ed === 'clock') { const [h, m] = e.zeit.split(':').map(Number); e.clock = { mode: 'h', H: h, M: m - (m % 5) }; } else if (d.ed === 'clockmode') e.clock.mode = d.val;
    else if (d.ed === 'clockval') { if (e.clock.mode === 'h') { e.clock.H = +d.val; e.clock.mode = 'm'; } else e.clock.M = +d.val; }
    else if (d.ed === 'clockok') { e.zeit = `${String(e.clock.H).padStart(2, '0')}:${String(e.clock.M).padStart(2, '0')}`; e.clock = null; } else if (d.ed === 'clockcancel') e.clock = null;
    else if (d.ed === 'name') return;
    const nameEl = $('[data-ed="name"]'); if (nameEl) e.name = nameEl.value; renderOverlay(); return;
  }
  if (d.sw) {
    if (d.sw.startsWith('ed:')) { const k = d.sw.slice(3); S.draft[k] = !S.draft[k]; renderOverlay(); return; }
    const map = { automatik: 'automatik', chairs: 'chairs', planerBereich: 'planerBereich', prognoseAktiv: 'prognoseAktiv', ninaZaehlt: 'ninaZaehlt', abweichung: 'abweichung' };
    if (map[d.sw]) S[map[d.sw]] = !S[map[d.sw]]; else if (d.sw === 'progH') S.prog.herbert = !S.prog.herbert; else if (d.sw === 'progN') S.prog.nicole = !S.prog.nicole; else if (d.sw === 'progNi') S.prog.nina = !S.prog.nina;
    if (d.sw === 'chairs') toast(S.chairs ? 'Sperrzone Esstisch gesetzt' : 'Sperrzone Esstisch entfernt');
    render(); return;
  }
  if (d.room && !d.rv && !d.seg) { const id = +d.room; S.selRooms.has(id) ? S.selRooms.delete(id) : S.selRooms.add(id); render(); return; }
  if (d.act === 'clearrooms') { S.selRooms = new Set(); render(); return; }
  if (d.mapmode) { S.mapMode = d.mapmode; S.goto = false; render(); return; }
  if (d.act === 'goto') { S.goto = !S.goto; render(); return; }
  if (d.map) { S.mapSel = +d.map; toast('select.heidi_selected_map → Karte ' + d.map); render(); return; }
  if (d.run) { const p = S.plans.find((x) => x.n === +d.run); if (!p.aktiv) { toast('Eintrag ist inaktiv'); return; } confirmDlg(`„${p.name}“ jetzt starten?`, '', () => { S.vac = 'cleaning'; STATES.cleaning.big = p.name; toast('Gestartet: ' + p.name); render(); }); return; }
  if (d.tl !== undefined) { const i = +d.tl; S.tlOpen.has(i) ? S.tlOpen.delete(i) : S.tlOpen.add(i); render(); return; }
  if (d.confirm) { confirmDlg(d.confirm, '', () => { if (d.then === 'cleanrooms') { S.vac = 'cleaning'; STATES.cleaning.big = 'Reinigt Räume'; S.selRooms = new Set(); toast('Gestartet (vacuum_clean_segment)'); render(); } else if (d.then === 'all') { S.vac = 'cleaning'; STATES.cleaning.big = 'Reinigt'; toast('Gestartet (vacuum.start)'); render(); } else toast('Ausgelöst'); }); return; }
  if (d.act === 'confirm-ok') { const then = S.overlay.then; S.overlay = null; renderOverlay(); then && then(); return; }
  if (d.act === 'close') { S.overlay = null; S.draft = null; renderOverlay(); return; }
  if (d.act === 'rooms-back' || d.act === 'est-back') { S.overlay = { kind: 'editor' }; renderOverlay(); return; }
  if (d.act === 'rooms-mode') { S.overlay.mode = d.val; renderOverlay(); return; }
  if (d.act === 'est-cmp') { S.overlay.cmp = !S.overlay.cmp; renderOverlay(); return; }
  if (d.act === 'ztype') { S.overlay.type = d.val; renderOverlay(); return; }
  if (d.act === 'zsave') { S.overlay = null; toast('Gespeichert: 1 Sperrzone, 1 Wisch-Sperrzone (vacuum_set_restricted_zone)'); renderOverlay(); return; }
  if (d.act === 'save') {
    const e = S.draft; const nameEl = $('[data-ed="name"]'); if (nameEl) e.name = nameEl.value.trim();
    if (!e.name) { toast('Bitte einen Namen vergeben'); return; } if (!e.raeume.length) { toast('Bitte mindestens einen Raum wählen'); return; }
    if (e.name.toLowerCase().includes('fehler')) { S.overlay = { kind: 'saveError' }; renderOverlay(); return; } // Demo: Teilfehler
    const i = S.plans.findIndex((x) => x.n === e.n); delete e.clock; delete e.changedOutside; S.plans[i] = e; S.overlay = null; S.draft = null; toast('Eintrag gespeichert (16 Service-Calls)'); render(); return;
  }
  if (d.toast) { toast(d.toast); return; }
});
$('#page').addEventListener('input', (e) => {
  const t = e.target; if (t.dataset.ed === 'name' && S.draft) S.draft.name = t.value;
  if (t.type === 'range') { const b = t.parentElement.querySelector('b'); if (!b) return; if (t.dataset.range === 'schnellMin') { S.schnellMin = +t.value; b.textContent = t.value + ' min'; } else if (t.dataset.range === 'minAkku') { S.minAkku = +t.value; b.textContent = t.value + ' %'; } else if (t.dataset.prange) { let v = +t.value; if (t.dataset.prange === 'intervall') { v = [5, 10, 15, 20, 30, 60].reduce((a, c) => Math.abs(c - v) < Math.abs(a - v) ? c : a); t.value = v; } S.prognose[t.dataset.prange] = v; b.textContent = v + b.textContent.replace(/^[\d]+/, ''); } else b.textContent = t.value + b.textContent.replace(/^[\d]+/, ''); }
});
$('#page').addEventListener('change', (e) => { const t = e.target; if (t.type === 'range' || t.tagName === 'SELECT' || t.type === 'time') { if (t.dataset.ed) return; toast('Gespeichert'); } });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.overlay) { S.overlay = null; S.draft = null; renderOverlay(); } });
// Zonen zeichnen (Mockup: Rechteck im SVG)
let zStart = null;
$('#page').addEventListener('pointerdown', (e) => { const m = e.target.closest('[data-zdraw]'); if (!m) return; const svg = m.querySelector('svg'), r = svg.getBoundingClientRect(); zStart = [(e.clientX - r.left) / r.width * 270, (e.clientY - r.top) / r.height * 235]; const d = document.createElementNS('http://www.w3.org/2000/svg', 'rect'); d.setAttribute('class', 'zone'); d.id = 'zdraft'; svg.appendChild(d); });
$('#page').addEventListener('pointermove', (e) => { if (!zStart) return; const m = e.target.closest('[data-zdraw]'); if (!m) return; const svg = m.querySelector('svg'), r = svg.getBoundingClientRect(), p = [(e.clientX - r.left) / r.width * 270, (e.clientY - r.top) / r.height * 235], d = svg.querySelector('#zdraft'); d.setAttribute('x', Math.min(zStart[0], p[0])); d.setAttribute('y', Math.min(zStart[1], p[1])); d.setAttribute('width', Math.abs(p[0] - zStart[0])); d.setAttribute('height', Math.abs(p[1] - zStart[1])); });
$('#page').addEventListener('pointerup', () => { if (!zStart) return; zStart = null; const d = $('#zdraft'); if (d) { d.removeAttribute('id'); toast('Neue Zone (Koordinaten über calibration_points → mm)'); } });

route();
</script>
