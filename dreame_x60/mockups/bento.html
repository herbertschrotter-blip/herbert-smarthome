<!doctype html>
<html lang="de">
<head>

<title>dreame_x60 – Heidi v2: Automotive Dark Bento (Mockup, alle Seiten)</title>
<style>
/* ───────── Design Tokens (Abschnitt 27 der Designvorgabe) ───────── */
:root {
  --heidi-bg: #0b1015; --heidi-bg-elevated: #10171e; --heidi-surface: #111a22; --heidi-surface-raised: #16212a; --heidi-surface-active: #1c2a36;
  --heidi-text: #e7edf3; --heidi-text-muted: #8a97a6; --heidi-text-faint: #5d6b7a;
  --heidi-accent: #58b7f6; --heidi-accent-soft: rgba(88,183,246,.14); --heidi-positive: #39d98a; --heidi-positive-soft: rgba(57,217,138,.14);
  --heidi-warning: #f2b544; --heidi-warning-soft: rgba(242,181,68,.14); --heidi-danger: #ef5b5b; --heidi-danger-soft: rgba(239,91,91,.14);
  --heidi-border: rgba(255,255,255,.08); --heidi-border-strong: rgba(255,255,255,.14);
  --heidi-radius-sm: 8px; --heidi-radius-md: 10px; --heidi-radius-lg: 14px; --heidi-radius-xl: 18px;
  --heidi-space-1: 4px; --heidi-space-2: 8px; --heidi-space-3: 12px; --heidi-space-4: 16px; --heidi-space-5: 24px;
  --heidi-shadow-float: 0 12px 32px rgba(0,0,0,.45);
  --heidi-dur: 160ms; --heidi-ease: cubic-bezier(.2,.7,.2,1);
  /* Kurzformen */
  --bg: var(--heidi-bg); --s1: var(--heidi-surface); --s2: var(--heidi-surface-raised); --s3: var(--heidi-surface-active);
  --text: var(--heidi-text); --muted: var(--heidi-text-muted); --faint: var(--heidi-text-faint);
  --accent: var(--heidi-accent); --good: var(--heidi-positive); --warn: var(--heidi-warning); --bad: var(--heidi-danger); --line: var(--heidi-border);
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: #06090c; color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 14px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { width: 18px; height: 18px; flex: none; }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.01em; }

/* ───────── Mockup-Leiste (nicht Teil der Karte) ───────── */
.tools { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 8px 14px; background: rgba(3,5,7,.7); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.tools b { color: var(--text); margin-right: 4px; }
.tools .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.tools .seg button { padding: 5px 11px; font-size: 12px; color: var(--muted); }
.tools .seg button.on { background: var(--heidi-surface-active); color: var(--text); }
.tools .note { margin-left: auto; color: var(--faint); }

/* ───────── Geräte-Rahmen ───────── */
.stage { padding: 18px; display: flex; justify-content: center; }
.frame { width: 100%; max-width: 1560px; height: max(700px, calc(100vh - 72px)); display: flex; flex-direction: column; background: var(--bg); border: 1px solid var(--heidi-border-strong); border-radius: 22px; overflow: hidden; container-type: inline-size; container-name: app; position: relative; }
.frame.tablet { width: 1024px; max-width: 100%; height: 768px; }
.frame.phone { width: 390px; max-width: 100%; height: 844px; border-radius: 40px; }

/* ───────── App-Gerüst: Sidebar + Inhalt ───────── */
.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); flex: 1; min-height: 0; overflow: hidden; }
.side { overflow: auto; min-height: 0; border-right: 1px solid var(--line); background: var(--heidi-bg-elevated); padding: var(--heidi-space-5) var(--heidi-space-3); display: flex; flex-direction: column; gap: var(--heidi-space-5); }
.brand { display: flex; align-items: center; gap: 12px; padding: 0 8px; }
.brand .logo { width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--accent); border-right-color: transparent; transform: rotate(-30deg); flex: none; }
.brand .t { font-size: 20px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.brand .s { font-size: 12px; color: var(--muted); }
.navlist { display: grid; gap: 4px; }
.navlist button { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: var(--heidi-radius-md); border: 1px solid transparent; color: var(--muted); font-size: 14px; font-weight: 500; text-align: left; transition: background var(--heidi-dur) var(--heidi-ease), color var(--heidi-dur); }
.navlist button:hover { background: var(--s1); color: var(--text); }
.navlist button.on { background: var(--heidi-surface-active); color: var(--text); border-color: rgba(88,183,246,.35); box-shadow: inset 3px 0 0 var(--accent); }
.navlist button svg { width: 20px; height: 20px; opacity: .9; }
.side .foot { margin-top: auto; display: grid; justify-items: center; gap: 8px; color: var(--muted); font-size: 12px; text-align: center; padding-bottom: 8px; }
.side .foot .robotpic { width: 120px; height: 120px; }
.side .foot .v { color: var(--faint); font-size: 11px; }
.tabbar { display: none; }

.content { overflow: auto; min-height: 0; padding: var(--heidi-space-5); display: grid; gap: var(--heidi-space-4); align-content: start; container-type: inline-size; container-name: content; min-width: 0; }
.topbar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.topbar h1 { font-size: 28px; }
.topbar .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
.topbar .back { display: inline-flex; align-items: center; gap: 4px; height: 40px; padding: 0 10px 0 6px; border-radius: var(--heidi-radius-md); color: var(--muted); font-weight: 500; }
.topbar .back:hover { background: var(--s1); color: var(--text); }
.topbar .meta { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.meta .mi { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-left: 1px solid var(--line); }
.meta .mi:first-child { border-left: 0; }
.meta .mi svg { width: 20px; height: 20px; color: var(--muted); }
.meta .mi b { display: block; font-size: 15px; font-weight: 600; line-height: 1.1; }
.meta .mi small { color: var(--muted); font-size: 11px; }
.meta .dotg { width: 7px; height: 7px; border-radius: 50%; background: var(--good); display: inline-block; margin-left: 6px; }

/* ───────── Bento-Flächen ───────── */
.bento { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--heidi-space-4); grid-auto-rows: min-content; }
.b { background: var(--s1); border: 1px solid var(--line); border-radius: var(--heidi-radius-lg); padding: var(--heidi-space-4); min-width: 0; display: flex; flex-direction: column; gap: var(--heidi-space-3); }
.b.raised { background: var(--s2); }
.b > .hd { display: flex; align-items: center; gap: 8px; min-height: 24px; }
.b > .hd h2 { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.b > .hd h2 svg { width: 18px; height: 18px; color: var(--muted); }
.b > .hd .r { margin-left: auto; font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
.b > .hd .r.link { color: var(--accent); }
.b > .hd .r svg { width: 14px; height: 14px; }
.lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.hint { font-size: 12px; color: var(--muted); line-height: 1.45; }
.span3 { grid-column: span 3; } .span4 { grid-column: span 4; } .span5 { grid-column: span 5; } .span6 { grid-column: span 6; } .span7 { grid-column: span 7; } .span8 { grid-column: span 8; } .span9 { grid-column: span 9; } .span12 { grid-column: span 12; }
.stack { display: grid; gap: var(--heidi-space-4); align-content: start; min-width: 0; }
.grow { flex: 1; }

/* Status-Punkt */
.st { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
.st i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.st.good i { background: var(--good); } .st.acc i { background: var(--accent); } .st.warn i { background: var(--warn); } .st.bad i { background: var(--bad); }
.st.good { color: var(--good); } .st.warn { color: var(--warn); } .st.bad { color: var(--bad); }
.st.pill { padding: 4px 10px; border-radius: 999px; font-size: 12px; background: var(--s2); border: 1px solid var(--line); }

/* Werte */
.kv { display: flex; align-items: baseline; gap: 10px; }
.kv .v { font-size: 32px; font-weight: 600; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.kv .u { font-size: 14px; color: var(--muted); }
.stat { display: grid; gap: 2px; }
.stat .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; line-height: 1.1; }
.stat .v small { font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 3px; }
.stat .l { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }

/* Robot-Panel */
.robot { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: start; }
.robot .name { font-size: 24px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.robot .pic { grid-column: 1; width: 100%; height: auto; max-width: 230px; aspect-ratio: 1; justify-self: center; }
.robot .batt { grid-column: 2; grid-row: 2; align-self: center; display: grid; gap: 4px; justify-items: start; }
.battbar { width: 18px; height: 34px; border: 2px solid var(--muted); border-radius: 4px; position: relative; padding: 2px; margin-top: 4px; }
.battbar::before { content: ""; position: absolute; top: -5px; left: 5px; width: 6px; height: 3px; border-radius: 1px; background: var(--muted); }
.battbar i { display: block; position: absolute; left: 2px; right: 2px; bottom: 2px; background: var(--good); border-radius: 2px; height: calc(var(--p) * 1%); }
.battbar.warn i { background: var(--warn); } .battbar.bad i { background: var(--bad); }
.params { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.param { background: var(--s2); border: 1px solid var(--line); border-radius: var(--heidi-radius-md); padding: 10px; display: grid; gap: 2px; min-height: 44px; text-align: left; }
.param b { font-size: 14px; font-weight: 600; } .param span { font-size: 11px; color: var(--muted); }
.param svg { width: 16px; height: 16px; color: var(--muted); margin-bottom: 2px; }

/* Knöpfe */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: var(--heidi-radius-md); background: var(--s2); border: 1px solid var(--line); font-weight: 600; font-size: 14px; color: var(--text); transition: background var(--heidi-dur), border-color var(--heidi-dur), transform 80ms; white-space: nowrap; }
.btn:hover { background: var(--s3); } .btn:active { transform: scale(.985); }
.btn.primary { background: var(--good); color: #062014; border-color: transparent; } .btn.primary:hover { filter: brightness(1.06); }
.btn.primary svg { color: #062014; }
.btn.danger { color: var(--bad); border-color: rgba(239,91,91,.35); }
.btn.on { border-color: var(--accent); background: var(--heidi-accent-soft); color: var(--text); }
.btn.sm { height: 36px; padding: 0 12px; font-size: 13px; }
.btn.icon { width: 44px; padding: 0; }
.btn svg { width: 18px; height: 18px; }
.ctl { display: grid; grid-template-columns: 1.4fr 1fr auto; gap: 8px; }
.iconbtn { width: 40px; height: 40px; border-radius: var(--heidi-radius-md); display: inline-flex; align-items: center; justify-content: center; color: var(--muted); border: 1px solid transparent; }
.iconbtn:hover { background: var(--s2); color: var(--text); }
.ib { width: 40px; height: 40px; border-radius: var(--heidi-radius-sm); display: inline-flex; align-items: center; justify-content: center; color: var(--muted); border: 1px solid var(--line); background: var(--s2); }
.ib:hover { color: var(--text); background: var(--s3); } .ib.go { color: var(--good); }

/* Chips, Segmente, Schalter */
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 999px; background: var(--s2); border: 1px solid var(--line); font-size: 12px; font-weight: 500; color: var(--text); white-space: nowrap; }
.chip svg { width: 14px; height: 14px; color: var(--muted); }
.chip.on { border-color: rgba(57,217,138,.45); background: var(--heidi-positive-soft); } .chip.on svg { color: var(--good); }
.chip.acc { border-color: rgba(88,183,246,.5); background: var(--heidi-accent-soft); } .chip.acc svg { color: var(--accent); }
.chip.warn { border-color: rgba(242,181,68,.5); background: var(--heidi-warning-soft); color: var(--warn); } .chip.warn svg { color: var(--warn); }
.chip.bad { border-color: rgba(239,91,91,.5); background: var(--heidi-danger-soft); color: var(--bad); }
.chip.k { height: 26px; font-size: 11px; padding: 0 8px; }
.chip.dim { opacity: .55; }
button.chip { cursor: pointer; } button.chip:hover { background: var(--s3); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.seg2 { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: var(--heidi-radius-md); padding: 3px; gap: 2px; max-width: 100%; flex-wrap: wrap; }
.seg2 button { height: 34px; padding: 0 12px; border-radius: 7px; font-size: 13px; font-weight: 500; color: var(--muted); white-space: nowrap; transition: background var(--heidi-dur), color var(--heidi-dur); }
.seg2 button.on { background: var(--s3); color: var(--text); box-shadow: inset 0 0 0 1px rgba(88,183,246,.5); }
.seg2.dis { opacity: .4; pointer-events: none; }
.sw { width: 44px; height: 26px; border-radius: 999px; background: var(--s3); border: 1px solid var(--heidi-border-strong); position: relative; flex: none; transition: background var(--heidi-dur), border-color var(--heidi-dur); }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--muted); transition: transform var(--heidi-dur) var(--heidi-ease), background var(--heidi-dur); }
.sw.on { background: var(--heidi-positive-soft); border-color: rgba(57,217,138,.5); } .sw.on::after { transform: translateX(18px); background: var(--good); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { height: 40px; padding: 0 12px; color: var(--muted); font-weight: 500; font-size: 13px; border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
.tabs button svg { width: 16px; height: 16px; }

/* Fortschritt / Balken */
.bar { height: 6px; border-radius: 999px; background: var(--s3); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: inherit; background: var(--good); width: calc(var(--p) * 1%); transition: width 400ms var(--heidi-ease); }
.bar.warn i { background: var(--warn); } .bar.bad i { background: var(--bad); } .bar.acc i { background: var(--accent); }
.meter { display: grid; grid-template-columns: minmax(84px, auto) 1fr 44px; align-items: center; gap: 10px; min-height: 32px; font-size: 13px; }
.meter .n { color: var(--muted); } .meter .p { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
button.meter { width: 100%; text-align: left; border-radius: var(--heidi-radius-sm); padding: 0 4px; } button.meter:hover { background: var(--s2); }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--heidi-radius-md); background: var(--s2); border: 1px solid var(--line); font-size: 13px; }
.note svg { color: var(--good); margin-top: 1px; } .note b { display: block; } .note small { color: var(--muted); font-size: 12px; }

/* Listen */
.list { display: grid; }
.row { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 6px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .t { font-size: 14px; font-weight: 500; } .row .s { font-size: 12px; color: var(--muted); margin-top: 1px; }
.row > div:first-child { flex: 1; min-width: 0; }
.row .v { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.row.link { cursor: pointer; } .row.link:hover .v { color: var(--text); }
.crow { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--heidi-radius-md); background: var(--s2); border: 1px solid var(--line); }
.crow .ic { width: 38px; height: 38px; border-radius: var(--heidi-radius-sm); background: var(--s3); display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
.crow .ic.on { color: var(--good); background: var(--heidi-positive-soft); }
.crow .t { font-weight: 600; font-size: 14px; } .crow .s { font-size: 12px; color: var(--muted); margin-top: 1px; }
.crow .sub { grid-column: 1 / -1; }
input[type=range] { accent-color: var(--accent); width: 130px; }
input[type=time], input[type=text], select { font: inherit; color: var(--text); background: var(--s2); border: 1px solid var(--line); border-radius: var(--heidi-radius-sm); padding: 9px 10px; min-height: 40px; }
input[type=text] { width: 100%; }
.tag { font-size: 11px; font-weight: 600; letter-spacing: .04em; padding: 3px 8px; border-radius: 6px; background: var(--s3); color: var(--muted); white-space: nowrap; }
.tag.acc { color: var(--accent); background: var(--heidi-accent-soft); }

/* Planer-Zeilen */
.plan { display: grid; }
.pr { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 12px; min-height: 60px; padding: 8px 0; border-top: 1px solid var(--line); }
.pr:first-child { border-top: 0; }
.pr .ic { width: 36px; height: 36px; border-radius: var(--heidi-radius-sm); background: var(--s2); display: inline-flex; align-items: center; justify-content: center; color: var(--muted); border: 1px solid var(--line); }
.pr.today .ic { color: var(--accent); border-color: rgba(88,183,246,.4); }
.pr .n { font-weight: 600; font-size: 14px; } .pr .s { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 2px; }
.pr .s svg { width: 13px; height: 13px; }
.pr.off .n, .pr.off .s { color: var(--faint); }
.pr .acts { display: flex; gap: 6px; }
.pr .when { text-align: right; font-variant-numeric: tabular-nums; } .pr .when b { display: block; font-size: 14px; } .pr .when small { color: var(--muted); font-size: 11px; }
.pr.compact { grid-template-columns: 1fr auto; min-height: 52px; }
.estline { display: inline-flex; align-items: center; gap: 4px; color: var(--good); font-weight: 500; }
.estline.bad { color: var(--warn); } .estline svg { width: 13px; height: 13px; }

/* Karte */
.map { position: relative; background: var(--heidi-bg); border: 1px solid var(--line); border-radius: var(--heidi-radius-md); overflow: hidden; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 24px 24px; }
.map > svg { display: block; width: 100%; height: auto; }
.map.tall > svg { max-height: 520px; margin: 0 auto; }
.map .room { fill: #1e2c39; stroke: #33495c; stroke-width: 1.2; cursor: pointer; transition: fill var(--heidi-dur), stroke var(--heidi-dur); }
.map .room:hover { fill: #253647; }
.map .room.sel { fill: rgba(88,183,246,.28); stroke: var(--accent); stroke-width: 1.8; }
.map .room.cur { fill: rgba(57,217,138,.22); stroke: var(--good); }
.map .room.done { fill: rgba(57,217,138,.1); stroke: rgba(57,217,138,.5); }
.map text { fill: #c3ced9; font-size: 9px; font-weight: 600; pointer-events: none; }
.map .zone { fill: rgba(239,91,91,.16); stroke: var(--bad); stroke-width: 1.2; stroke-dasharray: 3 2; }
.map .nomop { fill: rgba(88,183,246,.12); stroke: var(--accent); stroke-width: 1.2; stroke-dasharray: 3 2; }
.map .dock { fill: #3b5165; stroke: #6b8299; }
.map .bot { fill: #e7edf3; stroke: var(--good); stroke-width: 3; }
.map .path { fill: none; stroke: rgba(57,217,138,.55); stroke-width: 1.2; stroke-dasharray: 2 3; }
.map .scale { position: absolute; left: 12px; bottom: 10px; font-size: 10px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.map .scale::before { content: ""; width: 34px; height: 1px; background: var(--muted); }
.maptools { position: absolute; right: 10px; top: 10px; display: grid; gap: 2px; background: var(--s2); border: 1px solid var(--heidi-border-strong); border-radius: var(--heidi-radius-md); padding: 3px; box-shadow: var(--heidi-shadow-float); }
.maptools button { width: 40px; height: 40px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
.maptools button:hover { background: var(--s3); color: var(--text); } .maptools button.on { color: var(--accent); background: var(--heidi-accent-soft); }

// ───────── Seite: Prognose ─────────
function heatSvg(seed) {
  let s = seed; const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  const W = 48, H = 7, cw = 10, ch = 10; let out = '';
  for (let d = 0; d < H; d++) for (let t = 0; t < W; t++) { const hour = t / 2, home = (hour < 7.5 || hour > 17 + rnd() * 2) ? 0.85 + rnd() * .15 : (d >= 5 ? 0.6 + rnd() * .3 : rnd() * .25); out += `<rect x="${t * cw}" y="${d * ch}" width="${cw - 1}" height="${ch - 1}" rx="1" fill="rgba(88,183,246,${(home * .9).toFixed(2)})"/>`; }
  return `<svg viewBox="0 0 ${W * cw} ${H * ch}">${out}</svg>`;
}
function pagePrognose() {
  const p = S.prognose, tage = 23;
  const row = (k, v, c) => `<div class="row"><div><div class="s">${k}</div><div class="t">${v}</div></div>${c ? `<span class="tag acc">${c}</span>` : ''}</div>`;

  const lern = box('', 'Lernstatus', null, { html: tage >= p.mindesttage ? `<span class="st good"><i></i>aktiv</span>` : `ab ${p.mindesttage} Tagen` }, `<div class="meter" style="grid-template-columns:1fr auto"><span class="n">${tage} von ${p.wochen * 7} Tagen protokolliert · ${p.aufloesung}-min-Raster</span><span class="p">${Math.round(tage / (p.wochen * 7) * 100)} %</span></div><div class="datab"><i style="width:${Math.min(100, tage / (p.wochen * 7) * 100)}%"></i></div>
    <div class="list">${swRow('Abweichung heute', 'Urlaub, Feiertag – heute nicht lernen', 'abweichung', S.abweichung)}${swRow('Herbert einbeziehen', 'GPS + WLAN', 'progH', S.prog.herbert)}${swRow('Nicole einbeziehen', 'WLAN', 'progN', S.prog.nicole)}${swRow('Nina einbeziehen', 'WLAN', 'progNi', S.prog.nina)}<div class="row"><div><div class="t">Protokoll zurücksetzen</div><div class="s">shell_command.heidi_prognose_reset</div></div><button class="btn sm danger" data-confirm="Alle gelernten Anwesenheitsdaten löschen?">Löschen …</button></div></div>`);

  return topbar('Prognose', 'Lernende Anwesenheit · Grundlage für Start, Schnellprogramm und Rückkehr', true) + `<div class="bento"><div class="span6 stack">${heute}${lern}</div>${heat}</div>`;

$('#frame').addEventListener('click', async (e) => {

$('#frame').addEventListener('input', (e) => {
